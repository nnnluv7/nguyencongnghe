# Xuất bản trực tiếp các tệp rời; chỉnh HTML/CSS/JS trên GitHub rồi commit.
[build]
  command = "test -f public/index.html"
  publish = "public"

[functions]
  directory = "netlify/functions"

[functions."ncn-announcements"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/identity", "@netlify/blobs"]

# BEGIN NCN EVENT VIP
[build.environment]
  NODE_VERSION = "22"

[functions."ncn-event"]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/ncn-event-private/**"]
  external_node_modules = ["@netlify/identity", "@netlify/blobs", "qrcode"]

[[redirects]]
  from = "/assets/ncn-event-core.js"
  to = "/.netlify/functions/ncn-event?route=asset&name=core"
  status = 200
  force = true

[[redirects]]
  from = "/assets/ncn-event.js"
  to = "/.netlify/functions/ncn-event?route=asset&name=ui"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/ncn-event-bridge.user.js"
  to = "/.netlify/functions/ncn-event?route=asset&name=bridge"
  status = 200
  force = true
# END NCN EVENT VIP

# BEGIN NCN GVGS VIP
[functions."ncn-gvgs"]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/ncn-gvgs-private/**", "netlify/lib/ncn-event-private/stick.png", "netlify/lib/ncn-event-private/mt2-mincap.woff2", "public/assets/ncn-popup/catalogue.json", "public/assets/ncn-popup/media/gv2-*"]
  external_node_modules = ["@netlify/identity", "@netlify/blobs", "qrcode"]

[[redirects]]
  from = "/assets/ncn-gvgs-core.js"
  to = "/.netlify/functions/ncn-gvgs?route=asset&name=core"
  status = 200
  force = true

[[redirects]]
  from = "/assets/ncn-gvgs.js"
  to = "/.netlify/functions/ncn-gvgs?route=asset&name=ui"
  status = 200
  force = true

[[redirects]]
  from = "/downloads/ncn-gvgs-bridge.user.js"
  to = "/.netlify/functions/ncn-gvgs?route=asset&name=bridge"
  status = 200
  force = true
# END NCN GVGS VIP

# BEGIN NCN VIP PAYMENT
[functions."ncn-billing"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/identity", "@netlify/blobs"]

[functions."ncn-sepay-webhook"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
# END NCN VIP PAYMENT

# BEGIN NCN LIBRARY ADMIN
[functions."ncn-library"]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/ncn-library/**", "netlify/lib/ncn-news/**"]
  external_node_modules = ["@netlify/identity", "@netlify/blobs"]

[functions."ncn-library-page"]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/ncn-library/**", "netlify/lib/ncn-news/**", "public/index.html", "public/thu-vien/index.html", "public/20*/*/*.html", "public/p/*.html"]
  external_node_modules = ["@netlify/blobs"]
# END NCN LIBRARY ADMIN

[functions."ncn-stories"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/identity", "@netlify/blobs", "sharp"]

[functions."ncn-stories-cleanup"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "sharp"]

[functions."ncn-site-page"]
  node_bundler = "esbuild"
  included_files = ["public/**/*.html", "netlify/lib/ncn-shell/**", "netlify/lib/ncn-library/seed.json", "netlify/lib/ncn-news/**"]
  external_node_modules = ["@netlify/blobs"]

[functions."ncn-genk-sync"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[functions."ncn-arcade"]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/identity", "@netlify/blobs"]
