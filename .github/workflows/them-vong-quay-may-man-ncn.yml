name: Them Vong Quay May Man NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Them vong quay hoac go rieng cong cu nay'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  lucky-wheel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Them vong quay hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/them-vong-quay-may-man-ncn.yml').read_text()
          encoded=''.join(line.split(':',1)[1].strip() for line in source.splitlines() if line.startswith('# NCN_PAYLOAD_V1:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='1f66ef957c6e9e3c0bd62ddf2be777d934f0f7055cd7ecd906550e7a628caa25':raise ValueError('Goi cap nhat bi cat hoac sua. Can sao chep TOAN BO tep .txt.')
          payload=json.loads(raw)
          namespace={'__name__':'ncn_lucky_wheel_installer'}
          exec(compile(payload['installer'],'them-vong-quay.py','exec'),namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc':namespace['restore'](Path.cwd())
          else:namespace['install'](Path.cwd(),{n:base64.b64decode(v,validate=True) for n,v in payload['files'].items()},payload['meta'])
      - name: Kiem tra vong quay va giu giao dien, VIP, thanh toan
        shell: python
        run: |
          import json,os,subprocess,tomllib
          from pathlib import Path
          cfg=json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          tomllib.loads(Path('netlify.toml').read_text())
          if os.environ.get('NCN_ACTION')!='khoi-phuc':
            for name in ['public/assets/ncn-wheel/core.js','public/assets/ncn-wheel/app.js']:
              subprocess.run(['node','--check',name],check=True)
            tools=[t for t in cfg['tools'] if t.get('id')=='lucky-wheel']
            assert len(tools)==1 and tools[0]['href']=='/vong-quay-may-man/'
            page=Path('public/vong-quay-may-man/index.html').read_text()
            for marker in ['ncn-modern ncn-easy','id="ncn-wheel-app"','id="lw-wheel"','id="lw-spin"','id="lw-entries"','id="lw-history"','id="lw-result-dialog"','/assets/ncn-theme/site.css']:
              assert marker in page,marker
            pages=[p for p in Path('public').rglob('*.html') if 'BEGIN NCN MODERN SHELL' in p.read_text()]
            for p in pages:assert '/vong-quay-may-man/' in p.read_text(),str(p)
            print('Da kiem tra lien ket vong quay tren',len(pages),'trang.')
          kept=['netlify','netlify.toml','package.json','package-lock.json','public/_headers','public/_redirects','public/assets/ncn-theme/site.css','public/assets/ncn-theme/theme.js','public/assets/ncn-theme/easy-ui.js','public/assets/ncn-theme/mobile.js','public/assets/ncn-theme/visitor-counter.js','public/assets/ncn-theme/visitor-counter.css','public/assets/ncn-billing.js','public/assets/ncn-identity-client.js','public/assets/ncn-gvgs.css','public/assets/ncn-gvgs-auth.js','public/assets/ncn-cash','public/assets/ncn-direct','public/assets/ncn-sticker','public/assets/ncn-popup','public/assets/ncn-store-tools']
          subprocess.run(['git','diff','--exit-code','--',*kept],check=True)
      - name: Luu cac tep da doi vao nhanh chinh
        shell: python
        run: |
          import gzip,json,os,subprocess
          from pathlib import Path
          backup=Path('ncn-wheel-backup/state.json.gz')
          if not backup.exists():
            print('Khong co thay doi can luu.')
          else:
            state=json.loads(gzip.decompress(backup.read_bytes()))
            paths=sorted(set(state['installed'])|set(state['html_edits'])|{'public/assets/ncn-theme/config.json',backup.as_posix()})
            tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
            paths=[p for p in paths if Path(p).exists() or p in tracked]
            subprocess.run(['git','add','-A','--',*paths],check=True)
            result=subprocess.run(['git','diff','--cached','--quiet'])
            if result.returncode==1:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              message='revert(ncn): remove lucky wheel integration' if os.environ.get('NCN_ACTION')=='khoi-phuc' else 'feat(ncn): add lucky wheel with participant and result history'
              subprocess.run(['git','commit','-m',message],check=True)
              subprocess.run(['git','push','origin','HEAD:'+os.environ['NCN_BRANCH']],check=True)
            elif result.returncode!=0:raise RuntimeError('Khong kiem tra duoc git diff.')
            else:print('Da cap nhat, khong co thay doi moi.')

