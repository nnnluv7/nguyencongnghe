name: Sua tieu de NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Sua tieu de cac trang hoac khoi phuc ban truoc'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  sua-tieu-de:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Sua bo cuc va doi ten trang bao hiem
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_title_installer"}
          exec(compile(payload["installer"],"ncn-title-install.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd())
          else:namespace["install"](Path.cwd(),{name:base64.b64decode(data) for name,data in payload["files"].items()})
      - name: Kiem tra tep va giu nguyen cac cong cu
        run: |
          test -f public/2025/05/tu-van.html
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            test -f public/assets/ncn-theme/title-fix.css
          fi
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
          git diff --quiet -- public/assets/js public/assets/css public/assets/vendor public/assets/ncn-sticker public/assets/ncn-popup public/assets/ncn-cash public/assets/ncn-theme/theme.js public/assets/ncn-theme/theme.css public/assets/ncn-vip-auth.js
      - name: Luu sua doi len nhanh cua website
        run: |
          git add public ncn-title-backup
          if git diff --cached --quiet; then
            echo "Tieu de da o dung phien ban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sua bo cuc tieu de va doi ten Bao Hiem Tra Cham"
          git push origin HEAD:"$NCN_BRANCH"
