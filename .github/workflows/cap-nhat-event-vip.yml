name: Cap nhat Event VIP NCN
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-event-install
  cancel-in-progress: false
jobs:
  cap-nhat:
    if: github.repository == 'nnnluv7/nguyencongnghe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Them VIP va mau sticker bat giac
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, tomllib
          
          ALLOWED = {
           'public/in-event/index.html','public/assets/ncn-event.css','public/assets/ncn-vip-auth.js',
           'netlify/functions/ncn-event.mjs','netlify/lib/ncn-event-api.mjs',
           *['netlify/lib/ncn-event-private/'+name for name in ['admin.html','vip.html','core.cjs','ui.js','bridge.user.js','stick.png','mt2-mincap.woff2']]
          }
          AUTH = '<script type="module" src="/assets/ncn-vip-auth.js"></script>'
          BEGIN = '# BEGIN NCN EVENT VIP'
          END = '# END NCN EVENT VIP'
          CONFIG = '''# BEGIN NCN EVENT VIP
          [functions."ncn-event"]
            node_bundler = "esbuild"
            included_files = ["netlify/lib/ncn-event-private/**"]
            external_node_modules = ["@netlify/identity", "@netlify/blobs", "qrcode"]
          
          [[redirects]]
            from = "/assets/ncn-event-core.js"
            to = "/.netlify/functions/ncn-event?route=asset&name=core"
            status = 200
            force = true
          
          [[redirects]]
            from = "/assets/ncn-event.js"
            to = "/.netlify/functions/ncn-event?route=asset&name=ui"
            status = 200
            force = true
          
          [[redirects]]
            from = "/downloads/ncn-event-bridge.user.js"
            to = "/.netlify/functions/ncn-event?route=asset&name=bridge"
            status = 200
            force = true
          # END NCN EVENT VIP
          '''
          
          def install(root,files):
           root=Path(root);public=root/'public'
           if not (public/'index.html').is_file():raise SystemExit('Khong tim thay public/index.html.')
           if set(files)!=ALLOWED:raise SystemExit('Goi cap nhat VIP khong hop le.')
           configfile=root/'netlify.toml'
           config=configfile.read_text() if configfile.exists() else '[build]\n  command = "test -f public/index.html"\n  publish = "public"\n'
           parsed=tomllib.loads(config)
           if parsed.get('build',{}).get('publish','public')!='public':raise SystemExit('Publish directory can la public. Khong tu doi cau hinh tuy chinh.')
           if parsed.get('functions',{}).get('directory','netlify/functions')!='netlify/functions':raise SystemExit('Functions directory da tuy chinh. Can hop nhat cau hinh truoc.')
           if BEGIN in config:config=re.sub(re.escape(BEGIN)+r'[\s\S]*?'+re.escape(END)+r'\n?', '', config).rstrip()+'\n'
           elif 'ncn-event' in parsed.get('functions',{}):raise SystemExit('Da co cau hinh ncn-event rieng. Khong ghi de tu dong.')
           build_env=re.search(r'(^\[build\.environment\]\s*\n)([\s\S]*?)(?=^\[|\Z)',config,re.M)
           if build_env:
            envbody=build_env.group(2)
            if re.search(r'^\s*NODE_VERSION\s*=',envbody,re.M):envbody=re.sub(r'^\s*NODE_VERSION\s*=.*$', '  NODE_VERSION = "22"',envbody,flags=re.M)
            else:envbody+='  NODE_VERSION = "22"\n'
            config=config[:build_env.start(2)]+envbody+config[build_env.end(2):]
            vipconfig=CONFIG
           else:vipconfig=CONFIG.replace(BEGIN+'\n',BEGIN+'\n[build.environment]\n  NODE_VERSION = "22"\n\n',1)
           if not re.search(r'^\[functions\]\s*$',config,re.M):config=config.rstrip()+'\n\n[functions]\n  directory = "netlify/functions"\n'
           config=config.rstrip()+'\n\n'+vipconfig
           tomllib.loads(config)
           planned={root/p:content for p,content in files.items()}
           planned[configfile]=config.encode()
           pkgfile=root/'package.json';pkg=json.loads(pkgfile.read_text()) if pkgfile.exists() else {'private':True}
           pkg.setdefault('dependencies',{}).update({'@netlify/identity':'2.0.0','@netlify/blobs':'11.1.4','qrcode':'1.5.4'})
           planned[pkgfile]=(json.dumps(pkg,ensure_ascii=False,indent=2)+'\n').encode()
           if not (root/'.node-version').exists():planned[root/'.node-version']=b'22\n'
           for page in public.rglob('*.html'):
            original=planned.get(page,page.read_bytes());text=original.decode('utf8')
            if '/assets/ncn-vip-auth.js' not in text and '</body>' in text:
             planned[page]=text.replace('</body>',AUTH+'\n</body>',1).encode()
           changed=[]
           for p,data in planned.items():
            if p.is_file() and p.read_bytes()==data:continue
            p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data);changed.append(str(p.relative_to(root)))
           removed=[]
           for file in ['assets/ncn-event-core.js','assets/ncn-event.js','downloads/ncn-event-bridge.user.js']:
            p=public/file
            if p.exists():p.unlink();removed.append(str(p.relative_to(root)))
           summary={'changed':len(changed),'removed_public_module_files':removed,'private_files':len([p for p in files if p.startswith('netlify/')])}
           print(json.dumps(summary,ensure_ascii=False));return summary
          
          import base64,gzip,urllib.request,hashlib
          payload=''
          files={p:t.encode('utf8') for p,t in json.loads(gzip.decompress(base64.b64decode(payload))).items()}
          downloads={'netlify/lib/ncn-event-private/stick.png': {'url': 'https://mientay2.pro/in-online/sticker/gg2/stick.png', 'sha256': '0fc9717f61ce7a526b343e615d9318ff68f3bd8ce498c746f2d2774725499fed'}, 'netlify/lib/ncn-event-private/mt2-mincap.woff2': {'url': 'https://mientay2.pro/in-online/files/mt2-mincap.woff2', 'sha256': '5a1b43bf6d2e53795eb171e3055e602ff53a85fc67486491d5ca953821529595'}}
          for relative,data in downloads.items():
              with urllib.request.urlopen(data['url'],timeout=30) as response:
                  content=response.read()
              if hashlib.sha256(content).hexdigest()!=data['sha256']:
                  raise SystemExit('Tai nguyen mau goc da thay doi. Khong cap nhat de tranh sai mau in.')
              files[relative]=content
          install(Path.cwd(),files)
          PY
      - name: Kiem tra va cap nhat khoa phu thuoc
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node --check netlify/functions/ncn-event.mjs
          node --check netlify/lib/ncn-event-api.mjs
          node --check netlify/lib/ncn-event-private/core.cjs
          node --check netlify/lib/ncn-event-private/ui.js
          node --check netlify/lib/ncn-event-private/bridge.user.js
          test -f public/index.html
          test -f public/in-event/index.html
      - name: Luu ban cap nhat len main
        run: |
          if ! git diff --quiet -- .github/workflows; then
            echo "Khong day thay doi workflow bang token mac dinh."
            exit 1
          fi
          git add public netlify netlify.toml package.json package-lock.json .node-version
          if git diff --cached --quiet; then
            echo "Ban VIP da duoc cai, khong co thay doi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Event NCN: quyen admin/vip, bang gia chung va sticker bat giac"
          git push origin HEAD:main
