name: NCN - Sua game menu glass + icon
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-game-glass-icons
  cancel-in-progress: false
jobs:
  fix-game-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lay ma nguon nhanh main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dung Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cai dependencies
        run: npm ci --ignore-scripts
      - name: Ap dung va kiem tra
        shell: bash
        run: |
          cat > /tmp/ncn-game-repair.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import json, sys, re

          CSS_MARK = "/* BEGIN NCN GAME GLASS+ICON SYNC 20261017-v2 */"
          JS_MARK = "/* BEGIN NCN GAME ICON SYNC 20261017-v2 */"
          VERSION = "20261017-glass-icon-v2"

          CSS_PATCH = r"""
          /* BEGIN NCN GAME GLASS+ICON SYNC 20261017-v2 */
          :root{
            --ncn-ui-rim:rgba(255,255,255,.94);--ncn-ui-glass:#fdfefe;--ncn-ui-glass-strong:#fff;--ncn-ui-glass-soft:#f6f9fd;--ncn-ui-highlight:rgba(255,255,255,.75);
            --ncn-ui-shadow:0 12px 40px rgba(34,58,99,.10),0 2px 7px rgba(34,58,99,.05),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(183,203,227,.30);
            --ncn-ui-shadow-high:0 24px 70px rgba(13,34,65,.20),inset 0 1px 0 rgba(255,255,255,.95)
          }
          html[data-ncn-theme="dark"]{
            --ncn-ui-rim:rgba(220,235,255,.20);--ncn-ui-glass:rgba(18,31,52,.88);--ncn-ui-glass-strong:rgba(20,34,56,.96);--ncn-ui-glass-soft:rgba(55,77,109,.42);--ncn-ui-highlight:rgba(255,255,255,.12);
            --ncn-ui-shadow:0 12px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.11),inset 0 -1px 0 rgba(0,0,0,.30);
            --ncn-ui-shadow-high:0 24px 70px rgba(0,0,0,.40),inset 0 1px 0 rgba(255,255,255,.12)
          }
          .topbar{top:12px;left:max(12px,calc((100vw - 1392px)/2));right:max(12px,calc((100vw - 1392px)/2));bottom:auto;height:68px;padding:0 16px;gap:22px;border:1px solid var(--ncn-ui-rim);border-radius:28px;background:var(--ncn-ui-glass);box-shadow:var(--ncn-ui-shadow)}
          .topbar .brand{margin-left:104px}
          .topbar .ncn-game-brand-image{border:1px solid #ffffffc9;border-radius:14px;background:#fff;box-shadow:0 2px 7px #182e5310}
          #ncn-game-menu{top:24px;left:max(24px,calc((100vw - 1392px)/2 + 12px));min-height:44px;min-width:96px;padding:10px 16px;border:1px solid #ffffff55;border-radius:999px;background:linear-gradient(150deg,#2869c6,#1455ae);box-shadow:0 5px 15px #1455ae30,inset 0 1px 0 #ffffff77,inset 0 -1px 0 #0a3b8f44}
          #ncn-game-menu:hover{background:linear-gradient(150deg,#2c70cb,#1455ae);transform:translateY(-1px)}
          #ncn-game-theme{border:1px solid var(--ncn-ui-rim);border-radius:50%;background:var(--ncn-ui-glass-soft);color:var(--ncn-ink);box-shadow:inset 0 1px 0 var(--ncn-ui-highlight)}
          .app{padding-top:88px}
          .ncn-game-sidebar{width:350px;max-width:calc(100vw - 24px);border:1px solid var(--ncn-ui-rim);border-radius:28px;background:var(--ncn-ui-glass-strong);box-shadow:var(--ncn-ui-shadow-high)}
          .ncn-game-sidebar-head{padding:18px 17px 16px;border-bottom:1px solid var(--ncn-border)}
          .ncn-game-close{width:44px;height:44px;min-width:44px;border:1px solid var(--ncn-ui-rim);border-radius:50%;background:var(--ncn-ui-glass-soft);box-shadow:inset 0 1px 0 var(--ncn-ui-highlight)}
          .ncn-game-nav{padding:6px 13px 12px}
          .ncn-game-nav .ncn-section{display:block;margin:14px 10px 8px;color:var(--ncn-muted);font-size:10px;letter-spacing:1px;font-weight:800;text-transform:uppercase}
          .ncn-game-nav a{display:flex;align-items:center;gap:11px;min-height:46px;padding:11px 13px;border-radius:16px;margin:3px 0;color:var(--ncn-ink);font-size:13px;font-weight:650;line-height:1.4;transition:background .18s,color .18s,transform .18s}
          .ncn-game-nav a:hover{background:var(--ncn-ui-glass-soft);transform:translateX(2px)}
          .ncn-game-nav a[aria-current="page"]{background:#eaf1ff;color:#205ab2;font-weight:800}
          html[data-ncn-theme="dark"] .ncn-game-nav a[aria-current="page"]{background:#263e64;color:#d0e0ff}
          .ncn-game-nav .ncn-item-icon{display:grid;place-items:center;flex:none;width:19px;height:19px;color:var(--ncn-muted)}
          .ncn-game-nav .ncn-item-icon svg{display:block;width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
          .ncn-game-nav .ncn-item-title{flex:1;min-width:0;overflow-wrap:anywhere}
          .ncn-game-nav .ncn-vip-pill{margin-left:auto;padding:4px 6px;border-radius:6px;background:#f0eafa;color:#7951b8;font-size:9px;line-height:1}
          .ncn-game-admin{background:var(--ncn-ui-glass-soft);border-top:1px solid var(--ncn-border)}
          .ncn-game-admin a{border:1px solid var(--ncn-ui-rim);border-radius:9px;background:var(--ncn-ui-glass-strong);color:var(--ncn-ink)}
          .ncn-game-admin a:first-of-type{color:#087f3c}
          @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.topbar,.ncn-game-sidebar{-webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%)}}
          @media(max-width:900px){.topbar{top:8px;left:8px;right:8px;height:64px;gap:12px;padding:0 12px;border-radius:25px}.topbar .brand{margin-left:56px}#ncn-game-menu{top:18px;left:20px;width:44px;min-width:44px;padding:11px;border-radius:50%}#ncn-game-menu span{display:none}.app{padding-top:80px}}
          @media(max-width:620px){.topbar{padding:0 10px;gap:7px}.topbar .brand{gap:7px;margin-left:54px}#ncn-game-menu{left:20px}.app{padding:80px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}.ncn-game-sidebar{inset:8px auto 8px 8px;max-width:calc(100vw - 16px);max-height:calc(100dvh - 16px);border-radius:26px}}
          /* END NCN GAME GLASS+ICON SYNC 20261017-v2 */
          """

          def patch(root: Path):
              files = {
                  "css": root / "public/flappy-bird/site-bridge.css",
                  "js": root / "public/flappy-bird/site-bridge.js",
                  "html": root / "public/flappy-bird/index.html",
                  "config": root / "public/assets/ncn-theme/config.json",
              }
              for path in files.values():
                  if not path.exists():
                      raise RuntimeError(f"Thiếu file: {path}")
              css = files["css"].read_text(encoding="utf-8")
              js = files["js"].read_text(encoding="utf-8")
              html = files["html"].read_text(encoding="utf-8")
              cfg = json.loads(files["config"].read_text(encoding="utf-8"))
              tools = cfg.get("tools")
              if not isinstance(tools, list) or not tools:
                  raise RuntimeError("config.json không có tools hợp lệ")
              fallback = [{k:t[k] for k in ("id","title","href","icon","access") if k in t} for t in tools if isinstance(t, dict) and all(isinstance(t.get(k), str) for k in ("id","title","href"))]
              if CSS_MARK not in css:
                  css = css.rstrip() + "\n\n" + CSS_PATCH.strip() + "\n"
              if JS_MARK not in js:
                  js = js.replace("const priority = ['event', 'gvgs', 'cash', 'insurance'];", """const priority = ['event', 'gvgs', 'cash', 'insurance'];
            /* BEGIN NCN GAME ICON SYNC 20261017-v2 */
            const ICONS = {
              home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',
              printer:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6zM18 12h.01"/>',
              bag:'<path d="M5 7h14l2 14H3ZM8 7V5a4 4 0 0 1 8 0v2"/>',
              box:'<path d="m12 3 9 5v8l-9 5-9-5V8ZM3 8l9 5 9-5M12 13v8M7.5 5.5l9 5"/>',
              spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5ZM20 3v4M18 5h4"/>',
              sticker:'<path d="M21 12a9 9 0 1 0-9 9h2l7-7Z"/><path d="M14 21v-5a2 2 0 0 1 2-2h5M8 9h.01M15 9h.01M8 13c1 2 3 3 5 2"/>',
              panel:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 13h4M7 16h8M15 6h.01M18 6h.01"/>',
              layers:'<path d="m12 3 10 6-10 6L2 9ZM2 13l10 6 10-6M2 17l10 6 10-6"/>',
              bolt:'<path d="m13 2-9 12h7l-1 8 10-12h-7Z"/>',
              shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6ZM8 12l3 3 5-6"/>',
              tag:'<path d="M3 3h9l9 9-9 9-9-9ZM7 7h.01"/>',
              wallet:'<path d="M20 7H5a2 2 0 0 1 0-4h14v4M3 5v14a2 2 0 0 0 2 2h15V7M20 11h-5v6h5M17 14h.01"/>',
              qr:'<path d="M3 3h6v6H3ZM15 3h6v6h-6ZM3 15h6v6H3ZM15 15h3v3h3v3h-6ZM21 12v3M12 3v3M12 9v3H9M12 18v3M3 12h3"/>',
              book:'<path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1ZM12 5v15"/>'
            };
            function svg(name){ return '<svg viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.spark) + '</svg>'; }""", 1)
                  js = js.replace("const icon=document.createElement('span');icon.className='ncn-item-icon';icon.textContent=options.icon||'✦';", "const icon=document.createElement('span');icon.className='ncn-item-icon';icon.innerHTML=svg(options.icon||'spark');")
                  js = js.replace("for (const t of front) anchor(label[t.id]||t.title,t.href,{icon:'✦',vip:t.access==='vip'});", "for (const t of front) anchor(label[t.id]||t.title,t.href,{icon:t.icon||'spark',vip:t.access==='vip'});")
                  js = js.replace("section('TẤT CẢ CÔNG CỤ');anchor('Trang chủ','/',{icon:'⌂'});", "section('TẤT CẢ CÔNG CỤ');anchor('Trang chủ','/',{icon:'home'});")
                  js = js.replace("for (const t of back)anchor(t.title,t.href,{icon:t.id==='flappy-bird'?'🎮':'▦',vip:t.access==='vip'});", "for (const t of back)anchor(t.title,t.href,{icon:t.icon||'spark',vip:t.access==='vip'});")
                  js = js.replace("if (!items.some(t=>t.id==='flappy-bird'))anchor('Bay Đi Đừng Cáu','/flappy-bird/',{icon:'🎮'});", "if (!items.some(t=>t.id==='flappy-bird'))anchor('Bay Đi Đừng Cáu','/flappy-bird/',{icon:'spark'});")
                  js = js.replace("anchor('Thư viện bài viết','/thu-vien/',{icon:'▤'});", "anchor('Thư viện bài viết','/thu-vien/',{icon:'book'});")
              if "/* NCN FALLBACK TOOL LIST 20261017-v2 */" not in js:
                  js = js.replace("populate({tools:[]});", "/* NCN FALLBACK TOOL LIST 20261017-v2 */\n  populate({tools:" + json.dumps(fallback, ensure_ascii=False, separators=(',',':')) + "});", 1)
              html = re.sub(r'(site-bridge\.css\?v=)[0-9A-Za-z_-]+', r'\1' + VERSION, html, count=1)
              html = re.sub(r'(site-bridge\.js\?v=)[0-9A-Za-z_-]+', r'\1' + VERSION, html, count=1)
              changed = []
              for key, content in [("css", css), ("js", js), ("html", html)]:
                  path = files[key]
                  old = path.read_text(encoding="utf-8")
                  if old != content:
                      path.write_text(content, encoding="utf-8")
                      changed.append(str(path.relative_to(root)))
              return changed

          if __name__ == "__main__":
              root = Path(sys.argv[1] if len(sys.argv) > 1 else ".").resolve()
              changed = patch(root)
              print("Changed:", ", ".join(changed) if changed else "none (already applied)")

          PY
          python3 /tmp/ncn-game-repair.py .
          git diff --check
          node --check public/flappy-bird/site-bridge.js
          node --test tests/ncn-flight.test.cjs tests/ncn-gvgs.test.mjs tests/ncn-visitors.test.mjs
      - name: Commit khi qua test
        shell: bash
        run: |
          if git diff --quiet -- public/flappy-bird/index.html public/flappy-bird/site-bridge.css public/flappy-bird/site-bridge.js; then
            echo "Khong co thay doi moi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flappy-bird/index.html public/flappy-bird/site-bridge.css public/flappy-bird/site-bridge.js
          git commit -m "fix(ui): restore liquid glass and sync game menu icons"
          git push origin HEAD:main
