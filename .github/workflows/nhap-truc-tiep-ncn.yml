name: Nhap truc tiep tren mau NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Bat nhap truc tiep hoac khoi phuc truoc ban nay'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  nhap-truc-tiep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon website moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cai nhap truc tiep tren mau
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_direct_installer"}
          exec(compile(payload["installer"],"ncn-direct-install.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd())
          else:namespace["install"](Path.cwd(),{n:base64.b64decode(v) for n,v in payload["files"].items()},payload["bases"])
      - name: Kiem tra ma va quyen VIP cu
        run: |
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            node --check public/assets/ncn-direct/editor.js
            node --check public/assets/ncn-direct/preview.js
            node --check public/assets/ncn-sticker/app.js
            node --check public/assets/ncn-popup/app.js
            node --check public/assets/ncn-store-tools/app.js
          fi
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
          git diff --quiet -- public/assets/ncn-theme public/assets/ncn-cash public/assets/ncn-vip-auth.js public/assets/js public/assets/css public/assets/vendor public/assets/catalog.js public/assets/ncn-sticker/catalogue.json public/assets/ncn-popup/catalogue.json public/assets/ncn-store-tools/catalogue.json
      - name: Luu giao dien nhap truc tiep
        run: |
          git add public ncn-direct-backup
          if git diff --cached --quiet; then
            echo "Da o dung phien ban nhap truc tiep."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Nhap truc tiep tren mau Sticker Popup Ban hang Trang tri NCN"
          git push origin HEAD:"$NCN_BRANCH"
