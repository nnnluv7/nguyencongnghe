name: NCN - Dong bo giao dien Game
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Sua giao dien game hoac phuc hoi giao dien truoc do'
        type: choice
        options:
          - sua-giao-dien
          - khoi-phuc
        default: sua-giao-dien
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  fix-game-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon tu nhanh chinh
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dong bo game va sao luu
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/ncn-dong-bo-giao-dien-game.yml').read_text(encoding='utf-8')
          encoded=''.join(line.partition(':')[2].strip() for line in source.splitlines() if line.startswith('# NCN_GAME_UI_PAYLOAD:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='dd7bf63b61e39d9fbca643b28cd9a7c408a70daa10bf3c7e6cb29d0e0a847e49':
            raise ValueError('File workflow bi cat, hoac payload bi sua. Hay dan lai toan bo file.')
          data=json.loads(raw)
          namespace={'__name__':'ncn_ui_repair'}
          exec(compile(data['installer'],'ncn-game-ui-repair.py','exec'),namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc':
            namespace['rollback'](Path.cwd())
          else:
            files={name:base64.b64decode(value,validate=True) for name,value in data['files'].items()}
            namespace['repair'](Path.cwd(),files)
      - name: Kiem tra cac chuc nang game
        shell: bash
        run: |
          set -euo pipefail
          node --check public/flappy-bird/core.js
          node --check public/flappy-bird/game.js
          node --check public/flappy-bird/site-bridge.js
          if [ -f tests/ncn-flight.test.cjs ]; then node --test tests/ncn-flight.test.cjs; fi
          python - <<'PY'
          import json,os
          from pathlib import Path
          html=Path('public/flappy-bird/index.html').read_text()
          assert html.count('id="ncn-game-menu"')==1
          assert html.count('id="ncn-game-theme"')==1
          assert html.count('id="helpButton"')==1
          assert html.count('id="soundButton"')==1
          assert html.count('id="fullscreenButton"')==1
          assert 'ncn-game-brand-copy' in html
          data=json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          assert sum(t.get('id')=='flappy-bird' for t in data['tools'])==1
          if os.getenv('NCN_ACTION')!='khoi-phuc':
            css=Path('public/flappy-bird/site-bridge.css').read_text()
            assert 'body [hidden]' in css and 'display:none!important' in css
          print('Da kiem tra game, menu, che do an/hien va config.')
          PY
      - name: Luu ban va len GitHub
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- public/flappy-bird/index.html public/flappy-bird/site-bridge.css public/flappy-bird/site-bridge.js ncn-game-backup/state.json ncn-game-ui-backup/state.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi, khong tao build Netlify thu hai."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            git commit -m "revert(ncn): restore earlier arcade interface"
          else
            git commit -m "fix(ncn): align arcade UI with portal and hidden overlays"
          fi
          git push origin HEAD:"$NCN_BRANCH"

