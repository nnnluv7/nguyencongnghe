name: NCN Blast Block Puzzle
on:
  push:
    branches: [main]
    paths: ['public/ghep-khoi/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-blast.test.mjs', 'tests/browser/ncn-blast.mjs', '.github/workflows/ncn-blast.yml']
  pull_request:
    paths: ['public/ghep-khoi/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-blast.test.mjs', 'tests/browser/ncn-blast.mjs', '.github/workflows/ncn-blast.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  blast:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --test tests/ncn-blast.test.mjs tests/ncn-scores.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/ncn-blast.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-blast
          path: artifacts/blast/
          retention-days: 14
