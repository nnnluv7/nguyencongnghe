name: NCN Ocean Arcade
on:
  pull_request:
    paths: ['public/ca-lon-nuot-ca-be/**', 'public/assets/ncn-theme/**', 'scripts/sync-site-config.mjs', 'tests/ncn-fish.test.mjs', 'tests/browser/ncn-fish.mjs', '.github/workflows/ncn-fish.yml']
  push:
    branches: [main]
    paths: ['public/ca-lon-nuot-ca-be/**', 'public/assets/ncn-theme/**', 'scripts/sync-site-config.mjs', 'tests/ncn-fish.test.mjs', 'tests/browser/ncn-fish.mjs', '.github/workflows/ncn-fish.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ocean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --check public/ca-lon-nuot-ca-be/game.js && node --check public/ca-lon-nuot-ca-be/draw.js && node --test tests/ncn-fish.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/ncn-fish.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-ocean-arcade
          path: artifacts/fish/
          retention-days: 14
