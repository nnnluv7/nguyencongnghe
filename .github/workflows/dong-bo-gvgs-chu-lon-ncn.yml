name: "NCN - Đồng bộ GVGS chữ lớn"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Cài mẫu chữ lớn hoặc khôi phục mẫu trước đó"
        required: true
        default: cai-dat
        type: choice
        options:
          - cai-dat
          - khoi-phuc

permissions:
  contents: write

concurrency:
  group: ncn-gvgs-chu-lon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn hiện tại
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
