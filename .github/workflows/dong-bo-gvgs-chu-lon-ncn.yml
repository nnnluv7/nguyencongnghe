                  target=Path(name)
                  if value is None:
                      target.unlink(missing_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(base64.b64decode(value))
              print('Đã khôi phục các tệp trước khi cài Mẫu 2.')
          PY
      - name: Kiểm tra mẫu in, giá và quyền VIP
        if: inputs.action == 'cai-dat'
        run: |
          node --check netlify/functions/ncn-gvgs.mjs
          node --check netlify/lib/ncn-gvgs-private/core.cjs
          node --check netlify/lib/ncn-gvgs-private/ui.js
          node --check netlify/lib/ncn-gvgs-private/gv2-assets.cjs
          node --test tests/ncn-gvgs.test.mjs
          git diff --check
      - name: Lưu thay đổi lên GitHub
        env:
          NCN_ACTION: ${{ inputs.action }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- netlify.toml netlify/functions/ncn-gvgs.mjs netlify/lib/ncn-gvgs-private/admin.html netlify/lib/ncn-gvgs-private/core.cjs netlify/lib/ncn-gvgs-private/gv2-assets.cjs netlify/lib/ncn-gvgs-private/ui.js netlify/lib/ncn-gvgs-private/vip.html public/assets/ncn-gvgs.css public/in-gvgs/index.html tests/ncn-gvgs.test.mjs ncn-gv2-backup/state.json
          if git diff --cached --quiet; then
            echo "Các tệp đã đúng phiên bản, không cần commit thêm."
            exit 0
          fi
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            git commit -m "revert(ncn): restore GVGS templates before large type update"
          else
            git commit -m "feat(ncn): sync large GVGS template with popup gv-2"
          fi
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Hướng dẫn mở trang
        env:
          NCN_ACTION: ${{ inputs.action }}
        run: |
          echo "Thao tác $NCN_ACTION đã hoàn tất trên GitHub." >> "$GITHUB_STEP_SUMMARY"
          echo "Chờ Netlify xuất bản thành công, rồi mở https://nguyencongnghe.com/in-gvgs/ và tải lại trang." >> "$GITHUB_STEP_SUMMARY"
