name: Doi thuong hieu NCN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncn-branding
  cancel-in-progress: false

jobs:
  rebrand:
    if: github.repository == 'nnnluv7/nguyencongnghe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lay ban code main moi nhat
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Doi ten va logo tren tat ca trang
        shell: bash
        run: |
          python3 - <<'NCN_PYTHON'
          from pathlib import Path
          import re, html, json, os

          SITE = Path("public")
          DOMAIN = "nguyencongnghe.com"
          ORIGIN = "https://" + DOMAIN
          LOGO = "https://i.ibb.co/vg5gwhS/Bie-u-tru-ng-NCN-co-ng-nghe-to-i-gia-n.png"
          OLD = re.compile(r"(?:www\.)?chuyengia\.vip", re.I)
          TEXT_TYPES = {".html", ".htm", ".js", ".css", ".json", ".xml", ".txt", ".svg"}
          assert (SITE / "index.html").is_file(), "Khong tim thay public/index.html"
          changed, html_count, logo_count, compat = [], 0, 0, []
          attr_template = r'(?<![\w:-])%s\s*=\s*(?:"([^"]*)"|\'([^\']*)\'|([^\s>]+))'
          def get_attr(tag, name):
              m = re.search(attr_template % re.escape(name), tag, re.I)
              return next((v for v in m.groups() if v is not None), "") if m else ""
          def set_attr(tag, name, value):
              rx = re.compile(attr_template % re.escape(name), re.I)
              new = name + '="' + html.escape(value, quote=True) + '"'
              if rx.search(tag):
                  return rx.sub(lambda m: new, tag, count=1)
              return re.sub(r"\s*(/?>)$", lambda m: " " + new + m.group(1), tag, count=1)

          for path in sorted(SITE.rglob("*")):
              if not path.is_file() or path.suffix.lower() not in TEXT_TYPES:
                  continue
              try:
                  before = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              # This owner-provided calculator has an encoded hostname guard.
              # Retain only its internal compatibility host so it continues working.
              calculator = path.suffix == ".js" and "const calculatorLocation = new Proxy" in before
              if calculator:
                  after = before.replace(
                      "const original = new URL(window.CG_CONFIG.originalOrigin);",
                      'const original = new URL("https://www.chuyengia.vip");'
                  )
                  compat.append(str(path))
              else:
                  after = OLD.sub(DOMAIN, before)

              if path.suffix.lower() in {".html", ".htm"}:
                  html_count += 1
                  def logo_tag(m):
                      global logo_count
                      tag = m.group(0)
                      ident = get_attr(tag, "id")
                      src = get_attr(tag, "src")
                      if ident != "darkroom2" and "4a6410d114a754c3d9.png" not in src:
                          return tag
                      logo_count += 1
                      for key, value in [
                          ("src", LOGO), ("data-normal", LOGO), ("data-dark", LOGO),
                          ("alt", DOMAIN + " - NCN"), ("width", "160"), ("height", "64")
                      ]:
                          tag = set_attr(tag, key, value)
                      return tag
                  after = re.sub(r"<img\b[^>]*>", logo_tag, after, flags=re.I)
                  def icon_tag(m):
                      tag = m.group(0)
                      rel = get_attr(tag, "rel").lower().split()
                      if "icon" in rel or "apple-touch-icon" in rel:
                          tag = set_attr(tag, "href", LOGO)
                          tag = set_attr(tag, "type", "image/png")
                      return tag
                  after = re.sub(r"<link\b[^>]*>", icon_tag, after, flags=re.I)
                  def social_tag(m):
                      tag = m.group(0)
                      name = get_attr(tag, "name").lower()
                      prop = get_attr(tag, "property").lower()
                      if prop == "og:site_name":
                          return set_attr(tag, "content", DOMAIN)
                      if name == "msapplication-tileimage":
                          return set_attr(tag, "content", LOGO)
                      if path == SITE / "index.html" and (prop == "og:image" or name == "twitter:image"):
                          return set_attr(tag, "content", LOGO)
                      return tag
                  after = re.sub(r"<meta\b[^>]*>", social_tag, after, flags=re.I)
                  if "og:site_name" not in after:
                      after = re.sub(
                          r"</head\s*>",
                          '<meta property="og:site_name" content="' + DOMAIN + '"/>\n</head>',
                          after, count=1, flags=re.I
                      )
                  # The old contact fallback would otherwise link to its own page.
                  if path.name == "contact-us.html" and path.parent.name == "p":
                      def contact_link(m):
                          tag = m.group(0)
                          if "cg-contact-link" in get_attr(tag, "class").split():
                              return set_attr(tag, "href", "/p/about.html")
                          return tag
                      after = re.sub(r"<a\b[^>]*>", contact_link, after, flags=re.I)
                      after = after.replace("Mở mẫu liên hệ với quản trị viên", "Xem thông tin website")
                      after = re.sub(
                          r'(<p\b[^>]*class=["\']cg-contact-note["\'][^>]*>).*?(</p>)',
                          lambda m: m.group(1) + "Xem trang Giới thiệu để biết thêm thông tin về " + DOMAIN + "." + m.group(2),
                          after, flags=re.I | re.S
                      )
              if after != before:
                  path.write_text(after, encoding="utf-8")
                  changed.append(str(path))

          css = SITE / "assets/replica.css"
          if css.is_file():
              before = css.read_text(encoding="utf-8")
              marker = "/* NCN BRAND HEADER */"
              style = """/* NCN BRAND HEADER */
          #darkroom2 {
            width: auto !important;
            max-width: 160px !important;
            height: 42px !important;
            object-fit: contain;
          }
          """
              after = before
              if marker not in before:
                  after = before.rstrip() + "\n\n" + style
              if after != before:
                  css.write_text(after, encoding="utf-8")
                  changed.append(str(css))
          assert html_count > 0 and logo_count > 0, "Khong tim thay trang HTML hoac logo"
          assert len(compat) <= 1, "Can kiem tra cau truc cong cu tu van"
          remaining = []
          for path in SITE.rglob("*"):
              if path.is_file() and path.suffix.lower() in TEXT_TYPES and str(path) not in compat:
                  try:
                      if OLD.search(path.read_text(encoding="utf-8")):
                          remaining.append(str(path))
                  except UnicodeDecodeError:
                      pass
          assert not remaining, "Con thuong hieu cu: " + ", ".join(remaining)
          report = {"html_pages": html_count, "logos_updated": logo_count,
                    "changed_files": len(set(changed)), "calculator_compatibility": compat,
                    "logo_url": LOGO, "domain": DOMAIN}
          print(json.dumps(report, ensure_ascii=False, indent=2))
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
                  "## Da cap nhat thuong hieu NCN\n"
                  + "- Trang HTML: " + str(html_count) + "\n"
                  + "- Logo: " + str(logo_count) + "\n"
                  + "- Tep thay doi: " + str(len(set(changed))) + "\n"
                  + "- Ten website: " + DOMAIN + "\n"
                  + "- Dia chi logo: " + LOGO + "\n"
                  + "- Cong cu tu van giu host noi bo de tuong thich.\n",
                  encoding="utf-8"
              )

          NCN_PYTHON

      - name: Kiem tra code JavaScript
        shell: bash
        run: |
          node --check public/assets/site-config.js
          node --check public/assets/site-bridge.js
          node --check public/assets/catalog.js
          test -f public/index.html

      - name: Luu thay doi vao GitHub
        shell: bash
        run: |
          git add -- public
          if git diff --cached --quiet; then
            echo "Thuong hieu NCN da duoc cap nhat."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Doi thuong hieu sang nguyencongnghe.com va logo NCN"
          git push origin HEAD:main
