name: Cai cong cu Kiem quy NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cap nhat kiem quy hoac khoi phuc trang cu'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  kiem-quy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon cua website
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cap nhat trang kiem quy
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_cash_installer"}
          exec(compile(payload["installer"],"ncn-cash-install.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd())
          else:namespace["install"](Path.cwd(),{name:base64.b64decode(data) for name,data in payload["files"].items()})
      - name: Kiem tra tep that va pham vi thay doi
        run: |
          node --check public/assets/ncn-cash/core.js
          node --check public/assets/ncn-cash/app.js
          test -f public/2024/02/kiem-quy.html
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
          git diff --quiet -- public/assets/ncn-sticker public/assets/ncn-popup public/assets/ncn-theme public/in-event
      - name: Luu trang kiem quy len nhanh cua website
        run: |
          git add public ncn-cash-backup
          if git diff --cached --quiet; then
            echo "Kiem quy da o dung phien ban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cap nhat cong cu kiem quy NCN"
          git push origin HEAD:"$NCN_BRANCH"
