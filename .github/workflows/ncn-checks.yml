name: NCN checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install server dependencies
        run: npm install --no-save --package-lock=false
      - name: Kiểm tra JavaScript giao diện Admin và thông báo
        run: |
          node --check netlify/lib/ncn-event-private/ui.js
          node --check netlify/lib/ncn-gvgs-private/ui.js
          node --check public/assets/ncn-theme/scroll-ui.js
          node --check public/assets/ncn-theme/announcements.js
          node --check public/assets/ncn-theme/announcements-admin.js
          node --check netlify/lib/ncn-announcements-api.mjs
          node --check netlify/functions/ncn-announcements.mjs
          node --check public/assets/ncn-theme/mobile.js
          node --check public/assets/ncn-wheel/app.js
          node --check public/flappy-bird/game.js
          node --check public/assets/ncn-direct/editor.js
          node --check public/assets/ncn-direct/workspace.js
          node --check public/assets/ncn-cash/app.js
          node --check public/assets/ncn-account.js
          node --check public/assets/ncn-account-session.js
          node --check public/assets/ncn-vip-gate.js
          node --check public/assets/ncn-billing.js
      - name: Kiểm tra trang, công cụ và quyền xóa bảng giá
        run: node --test tests/*.test.cjs tests/*.test.mjs
