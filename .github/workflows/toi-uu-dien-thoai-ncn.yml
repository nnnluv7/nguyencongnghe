name: Toi uu dien thoai NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Toi uu giao dien dien thoai hoac go ban cap nhat nay'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  toi-uu-dien-thoai:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon website moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Toi uu giao dien dien thoai
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_mobile_installer"}
          exec(compile(payload["installer"],"ncn-mobile-install.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":
              namespace["restore"](Path.cwd())
          else:
              namespace["install"](Path.cwd(),{name:base64.b64decode(data) for name,data in payload["files"].items()})
      - name: Kiem tra va bao toan cong cu cu
        run: |
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            node --check public/assets/ncn-theme/mobile.js
            test -s public/assets/ncn-theme/mobile.css
          fi
          test -f public/2025/05/tu-van.html
          test -f public/2024/01/in-fifo.html
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
          git diff --quiet -- public/assets/js public/assets/css public/assets/vendor public/assets/ncn-sticker public/assets/ncn-popup public/assets/ncn-cash public/assets/ncn-store-tools public/assets/ncn-vip-auth.js public/assets/ncn-theme/theme.css public/assets/ncn-theme/theme.js public/assets/ncn-theme/title-fix.css public/assets/ncn-theme/config.json public/assets/catalog.js
      - name: Luu giao dien len nhanh cua website
        run: |
          git add public ncn-mobile-backup
          if git diff --cached --quiet; then
            echo "Giao dien dien thoai da o dung phien ban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Toi uu giao dien dien thoai NCN"
          git push origin HEAD:"$NCN_BRANCH"
