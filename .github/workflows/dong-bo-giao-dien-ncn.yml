name: Dong bo giao dien dien thoai va sang toi NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Don giao dien cu va sua sang/toi hoac khoi phuc'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  unify-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Dong bo giao dien hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/dong-bo-giao-dien-ncn.yml').read_text()
          encoded=''.join(line.split(':',1)[1].strip() for line in source.splitlines() if line.startswith('# NCN_PAYLOAD_V1:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='f04a1d36848a758559dd1754468b4dac5c07dd32e4a5020a341fe7913355c364':raise ValueError('Goi cap nhat bi cat hoac sua. Can sao chep TOAN BO tep .txt.')
          payload=json.loads(raw)
          namespace={'__name__':'ncn_mobile_dark_installer'}
          exec(compile(payload['installer'],'dong-bo-giao-dien.py','exec'),namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc':namespace['restore'](Path.cwd())
          else:namespace['install'](Path.cwd(),{n:base64.b64decode(v,validate=True) for n,v in payload['files'].items()},payload['meta'])
      - name: Kiem tra giao dien va bao toan cong cu
        shell: python
        run: |
          import json,os,re,subprocess,tomllib
          from pathlib import Path
          tomllib.loads(Path('netlify.toml').read_text())
          cfg=json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          names=['public/assets/ncn-theme/theme.js','public/assets/ncn-theme/menu.js','public/assets/ncn-theme/mobile.js','public/assets/js/59cde7058d21c3f959.js','public/assets/js/73d65e1c1d34ecc2be.js']
          if os.environ.get('NCN_ACTION')!='khoi-phuc':names.append('public/assets/ncn-theme/appearance.js')
          for name in names:subprocess.run(['node','--check',name],check=True)
          if os.environ.get('NCN_ACTION')!='khoi-phuc':
            assert [t['id'] for t in cfg['tools'][:4]]==['event','gvgs','cash','insurance']
            pages=[p for p in Path('public').rglob('*.html') if 'BEGIN NCN MODERN SHELL' in p.read_text()]
            for p in pages:
              text=p.read_text()
              for identifier in ['ncn-menu-open','ncn-topbar','ncn-navigation','ncn-footer','ncn-appearance-bootstrap','ncn-appearance-style']:assert text.count('id="'+identifier+'"')==1,str(p)+' '+identifier
              for identifier in ['header-wrapper','top-bar','footer-wrapper','inner-menu','mobile-menu','auth-header-mobile']:assert 'id="'+identifier+'"' not in text,str(p)+' '+identifier
              assert '<meta charset="utf-8">' in text[:1024],str(p)
              assert '/assets/ncn-theme/site.css?v=20261017-mobile-dark-1' in text,str(p)
              assert '/assets/ncn-theme/theme.js?v=20261017-mobile-dark-1' in text,str(p)
              bootstrap=text.index('id="ncn-appearance-bootstrap"')
              for resource in re.finditer(r'<script[^>]+src=|<link[^>]+rel="stylesheet"',text):assert bootstrap<resource.start(),str(p)
            print('Da kiem tra giao dien dong bo tren',len(pages),'trang.')
          kept=['netlify','netlify.toml','package.json','package-lock.json','public/_headers','public/_redirects','public/assets/ncn-theme/config.json','public/assets/ncn-theme/tool-ui.js','public/assets/ncn-theme/visitor-counter.js','public/assets/ncn-theme/visitor-counter.css','public/assets/ncn-billing.js','public/assets/ncn-identity-client.js','public/assets/ncn-gvgs.css','public/assets/ncn-gvgs-auth.js','public/assets/ncn-cash','public/assets/ncn-direct','public/assets/ncn-sticker','public/assets/ncn-popup','public/assets/ncn-store-tools','public/assets/ncn-wheel','public/assets/js/b638b6b6b0e4f4118c.js']
          subprocess.run(['git','diff','--exit-code','--',*kept],check=True)
      - name: Luu cac tep da doi vao nhanh chinh
        shell: python
        run: |
          import gzip,json,os,subprocess
          from pathlib import Path
          backup=Path('ncn-mobile-dark-backup/state.json.gz')
          if not backup.exists():print('Khong co thay doi can luu.')
          else:
            state=json.loads(gzip.decompress(backup.read_bytes()))
            paths=sorted(set(state['installed'])|set(state['before'])|set(state['html_edits'])|{backup.as_posix()})
            tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)))
            paths=[p for p in paths if Path(p).exists() or p in tracked]
            subprocess.run(['git','add','-A','--',*paths],check=True)
            result=subprocess.run(['git','diff','--cached','--quiet'])
            if result.returncode==1:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              message='revert(ncn): restore interface before mobile and appearance cleanup' if os.environ.get('NCN_ACTION')=='khoi-phuc' else 'fix(ncn): remove duplicate mobile shell and apply saved appearance early'
              subprocess.run(['git','commit','-m',message],check=True)
              subprocess.run(['git','push','origin','HEAD:'+os.environ['NCN_BRANCH']],check=True)
            elif result.returncode!=0:raise RuntimeError('Khong kiem tra duoc git diff.')
            else:print('Da cap nhat, khong co thay doi moi.')

