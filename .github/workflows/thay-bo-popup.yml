name: Thay bo Popup NCN
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-popup-install
  cancel-in-progress: false
jobs:
  thay-popup:
    if: github.repository == 'nnnluv7/nguyencongnghe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cai bo Popup 32 mau va chuyen cac trang cu
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import html,json,re
          
          ASSET_PREFIX='public/assets/ncn-popup/'
          FRAGMENT='popup-fragment.html'
          STYLE='<link rel="stylesheet" href="/assets/ncn-popup/style.css?v=20261014-popup-1"/>'
          SCRIPT='<script type="module" src="/assets/ncn-popup/app.js?v=20261014-popup-1"></script>'
          ALIASES={'/2022/06/popup-pk1.html': '/popup-a7/?mau=pk', '/2022/12/popup-giam-phan-tram-ict-gia-dung-btn.html': '/popup-a7/?mau=pk', '/2023/07/popup-ngan-5-tu-phone.html': '/popup-a7/?mau=led-giam', '/2023/07/popup-ban-trai-nghiem-1.html': '/popup-a7/?mau=btn-giam', '/2022/09/popup-ict-san-pham-ban-chay.html': '/popup-a7/?mau=btn-gach', '/2024/04/tam-long-a5-thay-popup-do.html': '/popup-a4-a5-a6/?mau=tvtl-giam-a5', '/2023/12/a5-dong-gia.html': '/popup-a4-a5-a6/?mau=tvtl-giam-a5', '/2023/12/a4-dau-line.html': '/popup-a4-a5-a6/?mau=mln-full', '/2023/11/popup-ban-kem.html': '/popup-a4-a5-a6/?nhom=giam-gia', '/2022/09/popup-a4-dien-may-giam-ngay.html': '/popup-a4-a5-a6/?mau=mln-full', '/2023/10/a4-combo-gia-dung.html': '/popup-a4-a5-a6/?nhom=giam-gia', '/2023/11/popup-combo-phu-kien.html': '/popup-a7/?mau=pk', '/2022/06/popup-a5-1.html': '/popup-a4-a5-a6/?mau=tvtl-giam-a5', '/2023/09/popup-dien-may-gia-gach-gia-giam.html': '/popup-a4-a5-a6/?mau=tvtl-gach', '/2022/09/popup-dien-may-tuy-chinh-a5-2.html': '/popup-a4-a5-a6/?mau=ml-ud', '/2022/09/popup-dien-may-tuy-chinh-a5-1.html': '/popup-a4-a5-a6/?mau=tvtl-giam-a5'}
          HUBS=['p/popup-a7.html', 'popup-a7/index.html', 'p/popup-a4-a5-a6.html', 'popup-a4-a5-a6/index.html']
          
          class BodyFinder(HTMLParser):
           def __init__(self,text):
            super().__init__(convert_charrefs=False)
            self.offsets=[0]
            for line in text.splitlines(keepends=True):self.offsets.append(self.offsets[-1]+len(line))
            self.depth=0;self.start=None;self.end=None;self.feed(text)
           def position(self):
            line,column=self.getpos();return self.offsets[line-1]+column
           def handle_starttag(self,tag,attrs):
            if self.end is not None:return
            if self.depth:
             if tag=='div':self.depth+=1
            elif tag=='div' and dict(attrs).get('id')=='postBody':
             self.start=self.position()+len(self.get_starttag_text());self.depth=1
           def handle_endtag(self,tag):
            if self.depth and tag=='div':
             self.depth-=1
             if self.depth==0:self.end=self.position()
          
          def patch_page(text,fragment,canonical):
           finder=BodyFinder(text)
           if finder.start is None or finder.end is None:raise ValueError('Trang Popup thiếu khối postBody. Không ghi đè trang khác.')
           text=text[:finder.start]+'\n'+fragment.strip()+'\n'+text[finder.end:]
           def body_class(match):
            tag=match.group(0)
            found=re.search(r'\bclass\s*=\s*([\'"])(.*?)\1',tag,re.S|re.I)
            if found:
             classes=found.group(2).split()
             if 'ncn-popup-page' not in classes:classes.append('ncn-popup-page')
             return tag[:found.start(2)]+' '.join(classes)+tag[found.end(2):]
            return tag[:-1]+' class="ncn-popup-page">'
           text=re.sub(r'<body\b[^>]*>',body_class,text,count=1,flags=re.I)
           if '/assets/ncn-popup/style.css' not in text:text=text.replace('</head>',STYLE+'\n</head>',1)
           if '/assets/ncn-popup/app.js' not in text:text=text.replace('</body>',SCRIPT+'\n</body>',1)
           if STYLE not in text or SCRIPT not in text:raise ValueError('Trang Popup thiếu cấu trúc head/body hoặc có phiên bản tùy chỉnh chưa phù hợp.')
           text=text.replace('https://nguyencongnghe.com/p/'+canonical.strip('/')+'.html','https://nguyencongnghe.com'+canonical)
           return text
          
          def redirect_page(target,vip):
           canonical='https://nguyencongnghe.com'+urlsplit(target).path
           auth='<script type="module" src="/assets/ncn-vip-auth.js"></script>' if vip else ''
           return '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bộ popup · nguyencongnghe.com</title><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url='+html.escape(target,quote=True)+'"><link rel="canonical" href="'+canonical+'"></head><body><p>Bộ popup đã được cập nhật. <a href="'+html.escape(target,quote=True)+'">Mở bộ popup mới</a>.</p>'+auth+'<script>location.replace('+json.dumps(target)+'+location.hash);</script></body></html>\n'
          
          def rewrite_links(text):
           def update(match):
            value=html.unescape(match.group(2));parts=urlsplit(value)
            if parts.netloc and parts.netloc.lower() not in {'nguyencongnghe.com','www.nguyencongnghe.com','chuyengia.vip','www.chuyengia.vip'}:return match.group(0)
            replacement=ALIASES.get(parts.path)
            if replacement:return 'href='+match.group(1)+html.escape(replacement,quote=True)+match.group(1)
            return match.group(0)
           return re.sub(r'\bhref\s*=\s*([\'"])(.*?)\1',update,text,flags=re.I|re.S)
          
          def install(root,files):
           root=Path(root);public=root/'public'
           if not (public/'index.html').is_file():raise SystemExit('Không tìm thấy public/index.html trong kho mã.')
           for name in files:
            path=Path(name)
            if path.is_absolute() or '..' in path.parts or (name!=FRAGMENT and not name.startswith(ASSET_PREFIX)):
             raise SystemExit('Gói cập nhật có tệp ngoài phạm vi Popup.')
           required={FRAGMENT,*[ASSET_PREFIX+x for x in ['app.js','core.js','style.css','catalogue.json']]}
           if not required.issubset(files):raise SystemExit('Gói cập nhật chưa đủ tệp Popup.')
           data=json.loads(files[ASSET_PREFIX+'catalogue.json'])
           if len(data['models'])!=32 or len(data['layouts'])!=32 or len(data['titles'])!=22:raise SystemExit('Danh mục Popup chưa đủ mẫu.')
           for a in data['assets']:
            relative='public'+a['path']
            if relative not in files:raise SystemExit('Thiếu tài nguyên in: '+relative)
            import hashlib
            if hashlib.sha256(files[relative]).hexdigest()!=a['sha256']:raise SystemExit('Tài nguyên in sai phiên bản: '+relative)
           fragment=files[FRAGMENT].decode('utf8')
           if not (public/'in-event/index.html').exists():fragment=re.sub(r'\s*<a class="st-link" href="/in-event/">.*?</a>','',fragment)
           planned={root/name:content for name,content in files.items() if name!=FRAGMENT}
           for family in ['popup-a7','popup-a4-a5-a6']:
            candidates=[public/('p/'+family+'.html'),public/(family+'/index.html')]
            templatefile=next((p for p in candidates if p.exists()),None)
            if templatefile is None:raise SystemExit('Không tìm thấy trang '+family+' hiện tại để giữ giao diện của anh.')
            template=templatefile.read_text()
            for page in candidates:
             original=page.read_text() if page.exists() else template
             planned[page]=patch_page(original,fragment,'/'+family+'/').encode('utf8')
           vip=(public/'assets/ncn-vip-auth.js').exists()
           for old,target in ALIASES.items():planned[public/old.lstrip('/')]=redirect_page(target,vip).encode('utf8')
           linked=0
           for page in public.rglob('*.html'):
            original=planned.get(page,page.read_bytes()).decode('utf8')
            new=rewrite_links(original)
            if new!=original:planned[page]=new.encode('utf8');linked+=1
           catalogfile=public/'assets/catalog.js'
           if catalogfile.exists():
            content=catalogfile.read_text()
            match=re.fullmatch(r'\s*window\.CG_CATALOG\s*=\s*(\[[\s\S]*\])\s*;?\s*',content)
            if not match:raise SystemExit('Danh mục tìm kiếm có cấu trúc tùy chỉnh. Cần ghép mục Popup trước khi cập nhật.')
            catalog=json.loads(match.group(1))
            catalog=[row for row in catalog if urlsplit(row.get('link','')).path not in {*ALIASES,*['/'+h for h in HUBS],'/popup-a7','/popup-a7/','/popup-a4-a5-a6','/popup-a4-a5-a6/'}]
            for family,small in [('popup-a7',True),('popup-a4-a5-a6',False)]:
             first=next(m for m in data['models'] if m['small']==small)
             catalog.append({'title':'Popup A7 / LED' if small else 'Popup A4 / A5 / A6','link':'/'+family+'/','thumbnail':{'src':first['thumbnail'],'type':'image'},'author':'NCN','authorimage':'','date':'14 tháng 10','datetime':'2026-10-14T00:00:00+07:00','summary':'Bộ popup giảm giá, trả chậm và dịch vụ; chọn tiêu đề, nhập nội dung và in.','labels':['Tools','In Ấn'],'category':'Công cụ','isPage':True})
            planned[catalogfile]=('window.CG_CATALOG = '+json.dumps(catalog,ensure_ascii=False)+';\n').encode('utf8')
           routesfile=public/'assets/routes.json'
           if routesfile.exists():
            routes=json.loads(routesfile.read_text())
            if not isinstance(routes,list):raise SystemExit('Danh sách đường dẫn có cấu trúc tùy chỉnh.')
            routes=[row for row in routes if row.get('path') not in ALIASES]
            for row in routes:
             if row.get('path') in {'/p/popup-a7.html','/popup-a7','/popup-a7/'}:row.update(title='Popup A7 / LED',kind='page')
             if row.get('path') in {'/p/popup-a4-a5-a6.html','/popup-a4-a5-a6','/popup-a4-a5-a6/'}:row.update(title='Popup A4 / A5 / A6',kind='page')
            for family in ['popup-a7','popup-a4-a5-a6']:
             if not any(row.get('path')=='/'+family+'/' for row in routes):routes.append({'path':'/'+family+'/','file':family+'/index.html','title':'Popup A7 / LED' if family=='popup-a7' else 'Popup A4 / A5 / A6','kind':'page'})
            planned[routesfile]=(json.dumps(routes,ensure_ascii=False,indent=2)+'\n').encode('utf8')
           sitemapfile=public/'sitemap.xml'
           if sitemapfile.exists():
            sitemap=sitemapfile.read_text()
            def trim_old(match):
             loc=re.search(r'<loc>(.*?)</loc>',match.group(0))
             return '' if loc and urlsplit(html.unescape(loc.group(1))).path in ALIASES else match.group(0)
            sitemap=re.sub(r'\s*<url>\s*<loc>[^<]*</loc>[\s\S]*?</url>',trim_old,sitemap)
            for family in ['popup-a7','popup-a4-a5-a6']:
             url='https://nguyencongnghe.com/'+family+'/'
             if url+'</loc>' not in sitemap:sitemap=sitemap.replace('</urlset>','  <url><loc>'+url+'</loc></url>\n</urlset>')
            planned[sitemapfile]=sitemap.encode('utf8')
           changed=[]
           for path,content in planned.items():
            if path.exists() and path.read_bytes()==content:continue
            path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content);changed.append(str(path.relative_to(root)))
           result={'changed':len(changed),'popup_models':32,'print_layouts':32,'hub_pages':4,'titles':22,'legacy_pages':len(ALIASES),'updated_link_pages':linked}
           print(json.dumps(result,ensure_ascii=False));return result
          
