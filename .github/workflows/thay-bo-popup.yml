opup/media/9817d17ae6d8452a.png': {'url': 'https://mientay2.pro/in-online/popup/tvtl/giam/img-sub.png', 'sha256': '342c2598ad0a4b5a0970cfd59e16a949270b9d4d5dbbdb827f350fd1bde2f8f9'}, 'public/assets/ncn-popup/media/84cd5a1aaa548ce5.png': {'url': 'https://mientay2.pro/in-online/popup/tvtl/tvtl.png', 'sha256': 'caf413877606a97e1468f1a07bf89fa4e623ef3f8afa1faf0afa01d36d75bb2a'}}
          
          files={name:text.encode('utf8') for name,text in json.loads(gzip.decompress(base64.b64decode(payload))).items()}
          def download(item):
              relative,metadata=item
              request=urllib.request.Request(metadata['url'],headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(request,timeout=30) as response:content=response.read()
              if hashlib.sha256(content).hexdigest()!=metadata['sha256']:
                  raise SystemExit('Tai nguyen in sai phien ban. Dung cap nhat: '+relative)
              return relative,content
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for relative,content in pool.map(download,downloads.items()):files[relative]=content
          install(Path.cwd(),files)
          PY
      - name: Kiem tra tep Popup
        run: |
          node --check public/assets/ncn-popup/core.js
          node --check public/assets/ncn-popup/app.js
          test -f public/index.html
          test -f public/p/popup.html
          test -f public/popup/index.html
      - name: Luu bo Popup len main
        run: |
          if ! git diff --quiet -- .github/workflows; then
            echo "Khong day thay doi workflow bang token mac dinh."
            exit 1
          fi
          git add public
          if git diff --cached --quiet; then
            echo "Bo Popup da duoc cai, khong co thay doi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Popup NCN: 32 mau, 32 ban in va thay cac trang cu"
          git push origin HEAD:main
