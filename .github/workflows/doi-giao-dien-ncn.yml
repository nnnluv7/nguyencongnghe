name: Doi giao dien NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cap nhat giao dien hoac khoi phuc giao dien cu'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  giao-dien:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon hien tai
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cap nhat giao dien va giu nguyen cong cu
        shell: python
        run: |
          import base64,gzip,hashlib,json,os,time,urllib.request
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_installer"}
          exec(compile(base64.b64decode(payload["installer"]),"ncn-installer.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":
              namespace["restore"](".")
          else:
              files={name:base64.b64decode(data) for name,data in payload["files"].items()}
              for asset in payload["assets"]:
                  data=None
                  for attempt in range(3):
                      try:
                          request=urllib.request.Request(asset["url"],headers={"User-Agent":"NCN-theme-install/1.0"})
                          with urllib.request.urlopen(request,timeout=40) as response:data=response.read()
                          if hashlib.sha256(data).hexdigest()!=asset["sha256"]:raise ValueError("Sai phiên bản ảnh: "+asset["path"])
                          break
                      except Exception:
                          if attempt==2:raise
                          time.sleep(1+attempt)
                  files[asset["path"]]=data
              namespace["install"](".",files)
      - name: Kiem tra tep va pham vi thay doi
        run: |
          test -f public/index.html
          node --check public/assets/ncn-theme/theme.js
          git diff --quiet -- .github/workflows
          git diff --quiet -- netlify package.json package-lock.json netlify.toml
      - name: Luu thay doi vao nhanh cua website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public ncn-theme-backup
          if git diff --cached --quiet; then
            echo "Giao dien da o dung phien ban."
            exit 0
          fi
          git commit -m "Cap nhat giao dien NCN"
          git push origin HEAD:"$NCN_BRANCH"
