name: NCN Soft Glass Nhe Mat
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-soft-glass-repair
  cancel-in-progress: false
jobs:
  unify-glass:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Run safe two-file CSS patch
        shell: bash
        run: |
          cat > /tmp/apply_soft_glass.py <<'PYTHON_NCN'
          #!/usr/bin/env python3
          """Safely replace only previously layered NCN visual glass blocks.

          Use: python3 apply_soft_glass.py /path/to/repository apply
               python3 apply_soft_glass.py /path/to/repository rollback

          Rollback works only for local apply with the saved backup and no later edits.
          GitHub Actions version commits only two CSS files; revert that commit if needed.
          """
          from pathlib import Path
          import argparse
          import hashlib
          import json
          import os
          import tempfile

          START = '/* BEGIN NCN SOFT GLASS 20261017-v1 */'
          GAME_START = '/* BEGIN NCN GAME SOFT GLASS 20261017-v1 */'
          FILES = [
              ('public/assets/ncn-theme/site.css', '01-site-soft-glass.css', START, [
                  ('/* BEGIN NCN UNIFIED LIQUID GLASS 20261017 */', '/* END NCN UNIFIED LIQUID GLASS 20261017 */'),
                  ('/* BEGIN NCN MOBILE GLASS 20261017-v1 */', '/* END NCN MOBILE GLASS 20261017-v1 */'),
              ]),
              ('public/flappy-bird/site-bridge.css', '02-game-soft-glass.css', GAME_START, [
                  ('/* BEGIN NCN GAME GLASS POLISH 20261017 */', '/* END NCN GAME GLASS POLISH 20261017 */'),
                  ('/* BEGIN NCN GAME MOBILE GLASS 20261017-v1 */', '/* END NCN GAME MOBILE GLASS 20261017-v1 */'),
              ]),
          ]

          def hash_text(s):
              return hashlib.sha256(s.encode('utf-8')).hexdigest()

          def remove_block(source, start, end):
              if source.count(start) != 1 or source.count(end) != 1:
                  raise ValueError(f'Unexpected or missing marker: {start}')
              a = source.index(start)
              b = source.index(end) + len(end)
              if b < a:
                  raise ValueError(f'Out of order marker: {start}')
              return source[:a].rstrip() + '\n\n' + source[b:].lstrip('\r\n')

          def replace_file(path, data):
              temp = path.with_name(path.name + '.ncn-calm-temp')
              temp.write_text(data, encoding='utf-8')
              os.replace(temp, path)

          def apply(repo, asset_dir, no_backup=False):
              prepared = []
              for rel, asset, start, removals in FILES:
                  path = repo / rel
                  if not path.is_file():
                      raise ValueError(f'File missing: {rel}')
                  original = path.read_text(encoding='utf-8')
                  if original.count(start) == 1:
                      print(f'Already updated: {rel}')
                      continue
                  if start in original:
                      raise ValueError(f'Duplicate/partial patch: {rel}')
                  if rel.endswith('site-bridge.css') and '#ncn-game-topbar > #ncn-game-menu' not in original:
                      raise ValueError('Game menu structure changed; refusing to edit')
                  updated = original
                  for a,b in removals:
                      updated = remove_block(updated, a, b)
                  patch_file = asset_dir / asset
                  patch = patch_file.read_text(encoding='utf-8').strip() + '\n'
                  if not patch.startswith(start) or patch.count(start) != 1 or not patch.strip().endswith('*/'):
                      raise ValueError(f'Invalid bundled patch: {asset}')
                  if '@media print' in patch or '<script' in patch or '.game-shell' in patch:
                      raise ValueError(f'Unexpected content in patch: {asset}')
                  updated = updated.rstrip() + '\n\n' + patch
                  prepared.append((rel,path,original,updated))
              # All preflight checks happen before any file changes.
              if not prepared:
                  print('No changes required.')
                  return
              if not no_backup:
                  backup = repo / '.ncn-calm-backup'
                  backup.mkdir(parents=True,exist_ok=True)
                  manifest = {}
                  for rel,path,original,updated in prepared:
                      key = 'site.css.bak' if rel.endswith('/site.css') else 'site-bridge.css.bak'
                      (backup / key).write_text(original,encoding='utf-8')
                      manifest[rel] = {'backup':key,'applied_sha256':hash_text(updated)}
                  (backup/'manifest.json').write_text(json.dumps(manifest,indent=2),encoding='utf-8')
              for rel,path,original,updated in prepared:
                  replace_file(path,updated)
                  print(f'Updated: {rel}')

          def rollback(repo):
              backup = repo / '.ncn-calm-backup'
              manifest_path = backup / 'manifest.json'
              if not manifest_path.is_file():
                  raise ValueError('No local backup. On GitHub, revert the corresponding commit instead.')
              manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
              prepared=[]
              for rel, info in manifest.items():
                  path=repo/rel
                  current=path.read_text(encoding='utf-8')
                  if hash_text(current)!=info['applied_sha256']:
                      raise ValueError(f'{rel} was edited after apply. Refusing to overwrite later work.')
                  original=(backup/info['backup']).read_text(encoding='utf-8')
                  prepared.append((rel,path,original))
              for rel,path,original in prepared:
                  replace_file(path,original)
                  print(f'Restored: {rel}')
              manifest_path.unlink()

          def main():
              p=argparse.ArgumentParser()
              p.add_argument('repo',help='Path to nguyencongnghe repository')
              p.add_argument('mode',choices=['apply','rollback'])
              p.add_argument('--assets-dir',help='Patch CSS folder, defaults to script folder')
              p.add_argument('--no-backup',action='store_true',help='For disposable CI checkout only')
              a=p.parse_args()
              repo=Path(a.repo).resolve()
              if not repo.is_dir():
                  raise ValueError('Repository directory does not exist')
              if a.mode=='apply':
                  apply(repo,Path(a.assets_dir or Path(__file__).resolve().parent),a.no_backup)
              else:
                  rollback(repo)

          if __name__=='__main__':
              main()
          PYTHON_NCN
          cat > /tmp/01-site-soft-glass.css <<'CSS_NCN_SITE'
          /* BEGIN NCN SOFT GLASS 20261017-v1 */
          /* Quiet visual layer shared by desktop and mobile. Screen only; print sheets untouched. */
          @media screen {
            body.ncn-modern {
              --ncn-bg:#f3f6f9;
              --ncn-ink:#203249;
              --ncn-muted:#586b80;
              --ncn-accent:#2c659f;
              --ncn-border:rgba(124,148,175,.28);
              --ncn-rim:rgba(143,164,190,.42);
              --ncn-highlight:rgba(255,255,255,.35);
              --ncn-glass:rgba(249,251,253,.91);
              --ncn-glass-strong:rgba(251,252,254,.95);
              --ncn-glass-soft:rgba(241,246,250,.89);
              --ncn-glass-card:rgba(255,255,255,.91);
              --ncn-calm-nav:rgba(250,252,254,.94);
              --ncn-calm-card:rgba(255,255,255,.91);
              --ncn-calm-control:rgba(244,248,252,.91);
              --ncn-calm-line:rgba(129,152,180,.34);
              --ncn-calm-shadow:0 8px 27px rgba(28,55,85,.085),0 1px 3px rgba(28,55,85,.045);
              --ncn-calm-shadow-lg:0 15px 42px rgba(28,55,85,.13),0 2px 6px rgba(28,55,85,.055);
              --ncn-shadow:var(--ncn-calm-shadow);
              --ncn-shadow-high:var(--ncn-calm-shadow-lg);
              --ncn-unified-panel:var(--ncn-calm-card);
              --ncn-unified-panel-strong:var(--ncn-calm-nav);
              --ncn-unified-input:var(--ncn-calm-control);
              --ncn-unified-rim:var(--ncn-calm-line);
              --ncn-unified-line:var(--ncn-calm-line);
              --ncn-unified-shadow:var(--ncn-calm-shadow);
              --ncn-mobile-panel:var(--ncn-calm-card);
              --ncn-mobile-strong:var(--ncn-calm-nav);
              --ncn-mobile-control:var(--ncn-calm-control);
              --ncn-mobile-rim:var(--ncn-calm-line);
              --ncn-mobile-line:var(--ncn-calm-line);
              --ncn-mobile-shadow:var(--ncn-calm-shadow);
              background-color:var(--ncn-bg)!important;
              background-image:none!important;
            }
            html[data-ncn-theme="dark"] body.ncn-modern,
            body.ncn-modern.dark {
              --ncn-bg:#111d2c;
              --ncn-ink:#e8edf5;
              --ncn-muted:#a9bbcd;
              --ncn-accent:#9fc7fb;
              --ncn-border:rgba(168,189,214,.22);
              --ncn-rim:rgba(169,192,221,.25);
              --ncn-highlight:rgba(255,255,255,.07);
              --ncn-glass:rgba(30,45,65,.94);
              --ncn-glass-strong:rgba(32,47,68,.97);
              --ncn-glass-soft:rgba(42,60,84,.88);
              --ncn-glass-card:rgba(30,45,65,.94);
              --ncn-calm-nav:rgba(30,45,65,.97);
              --ncn-calm-card:rgba(31,46,67,.94);
              --ncn-calm-control:rgba(47,66,90,.92);
              --ncn-calm-line:rgba(168,189,214,.25);
              --ncn-calm-shadow:0 9px 27px rgba(0,0,0,.17),0 1px 3px rgba(0,0,0,.10);
              --ncn-calm-shadow-lg:0 15px 42px rgba(0,0,0,.28);
            }
            body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown) {
              background:var(--ncn-calm-nav);
              border-color:var(--ncn-calm-line);
              box-shadow:var(--ncn-calm-shadow-lg);
            }
            body.ncn-modern :is(#ncn-footer,.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-contact-panel,.ncn-quick-card),
            body.ncn-modern #ncn-event-app :is(.ev-panel,.ev-dialog),
            body.ncn-modern :is(#ncn-sticker-app,#ncn-popup-app,#ncn-store-app) :is(.st-panel:not(.st-preview-panel),.st-card),
            body.ncn-modern #ncn-wheel-app .lw-panel,
            body.ncn-modern #ncn-billing-app :is(.pay-panel,.pay-plan),
            body.ncn-modern #ncn-cash-app :is(.cq-panel,.cq-metric:not(.cq-metric-main),#cq-copy-dialog) {
              background:var(--ncn-calm-card);
              border-color:var(--ncn-calm-line);
              box-shadow:var(--ncn-calm-shadow);
            }
            body.ncn-modern :is(.ncn-icon-button,.ncn-account-menu summary,.ncn-top-search,.ncn-admin-links a,.ncn-button-glass),
            body.ncn-modern .auth-modal .auth-input {
              background:var(--ncn-calm-control);
              border-color:var(--ncn-calm-line);
              box-shadow:none;
            }
            body.ncn-modern :is(.ncn-menu-heading,.ncn-admin-card,.ncn-search-dialog-head) {
              border-color:var(--ncn-calm-line);
            }
            body.ncn-modern .ncn-admin-card,
            body.ncn-modern .ncn-search-dialog-head {background:var(--ncn-calm-nav)}
            body.ncn-modern .auth-modal .auth-box {
              background:var(--ncn-calm-nav);
              color:var(--ncn-ink);
              border:1px solid var(--ncn-calm-line);
              border-radius:22px;
              box-shadow:var(--ncn-calm-shadow-lg);
            }
            body.ncn-modern .auth-modal .auth-input {
              border-radius:12px;
              color:var(--ncn-ink);
            }
            body.ncn-modern .auth-modal .auth-submit {
              background:#2d67a7;
              color:#fff;
              border-radius:12px;
              box-shadow:0 4px 12px rgba(31,85,150,.16);
            }
            body.ncn-modern #ncn-menu-open {
              background:linear-gradient(150deg,#3572b6,#2762a2);
              box-shadow:0 5px 16px rgba(35,85,149,.16),inset 0 1px rgba(255,255,255,.18);
            }
            body.ncn-modern .ncn-tool-card::before,
            body.ncn-modern .ncn-welcome-panel::before {opacity:.10}
            body.ncn-modern .ncn-tool-card:hover {box-shadow:0 11px 28px rgba(28,55,85,.105)}
            body.ncn-modern .ncn-nav-link:hover {transform:none}
            body.ncn-modern .ncn-tool-card {border-radius:20px}
            body.ncn-modern .ncn-welcome-panel {border-radius:24px}
            body.ncn-modern #ncn-topbar {border-radius:24px}
            body.ncn-modern #ncn-sidebar {border-radius:25px}
            body.ncn-modern :is(#ncn-event-app .ev-field input,#ncn-event-app .ev-field select,
                                #ncn-sticker-app .st-field input,#ncn-sticker-app .st-field select,
                                #ncn-popup-app .st-field input,#ncn-popup-app .st-field select,
                                #ncn-billing-app .pay-form input) {
              background:var(--ncn-calm-control);
              border-color:var(--ncn-calm-line);
              color:var(--ncn-ink);
            }
            @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))) {
              body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown,.auth-modal .auth-box),
              body.ncn-modern #ncn-event-app .ev-dialog,
              body.ncn-modern #ncn-cash-app #cq-copy-dialog {
                -webkit-backdrop-filter:blur(12px) saturate(112%);
                backdrop-filter:blur(12px) saturate(112%);
              }
              body.ncn-modern :is(#ncn-footer,.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-contact-panel,.ncn-quick-card),
              body.ncn-modern #ncn-event-app .ev-panel,
              body.ncn-modern :is(#ncn-sticker-app,#ncn-popup-app,#ncn-store-app) :is(.st-panel:not(.st-preview-panel),.st-card),
              body.ncn-modern #ncn-wheel-app .lw-panel,
              body.ncn-modern #ncn-billing-app :is(.pay-panel,.pay-plan),
              body.ncn-modern #ncn-cash-app :is(.cq-panel,.cq-metric:not(.cq-metric-main)) {
                -webkit-backdrop-filter:blur(4px) saturate(105%);
                backdrop-filter:blur(4px) saturate(105%);
              }
            }
            @media(max-width:900px) {
              body.ncn-modern #ncn-topbar {border-radius:21px}
              body.ncn-modern #ncn-sidebar {border-radius:22px}
              body.ncn-modern :is(.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-quick-card) {box-shadow:0 5px 16px rgba(28,55,85,.07)}
              body.ncn-modern :is(.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-quick-card) {border-radius:18px}
            }
          }
          /* Preserve high contrast and accessibility preferences; avoid forcing transparency. */
          @media screen and (prefers-reduced-transparency:reduce),
                 screen and (prefers-contrast:more),
                 screen and (forced-colors:active) {
            body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown,.auth-modal .auth-box),
            body.ncn-modern :is(.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-quick-card) {
              background:var(--ncn-surface)!important;
              -webkit-backdrop-filter:none!important;
              backdrop-filter:none!important;
            }
          }
          /* END NCN SOFT GLASS 20261017-v1 */
          CSS_NCN_SITE
          cat > /tmp/02-game-soft-glass.css <<'CSS_NCN_GAME'
          /* BEGIN NCN GAME SOFT GLASS 20261017-v1 */
          /* Game chrome only: the canvas, gameplay and menu placement are unchanged. */
          @media screen {
            :root {
              --ncn-bg:#f3f6f9;
              --ncn-ink:#203249;
              --ncn-muted:#586b80;
              --ncn-border:rgba(124,148,175,.30);
              --ncn-game-calm-nav:rgba(250,252,254,.95);
              --ncn-game-calm-control:rgba(244,248,252,.92);
              --ncn-game-calm-line:rgba(129,152,180,.34);
              --ncn-game-calm-shadow:0 9px 29px rgba(28,55,85,.10),0 1px 3px rgba(28,55,85,.045);
            }
            html[data-ncn-theme="dark"] {
              --ncn-bg:#111d2c;
              --ncn-ink:#e8edf5;
              --ncn-muted:#a9bbcd;
              --ncn-border:rgba(168,189,214,.22);
              --ncn-game-calm-nav:rgba(30,45,65,.97);
              --ncn-game-calm-control:rgba(47,66,90,.92);
              --ncn-game-calm-line:rgba(168,189,214,.25);
              --ncn-game-calm-shadow:0 12px 32px rgba(0,0,0,.24);
            }
            body {background:var(--ncn-bg)!important;color:var(--ncn-ink)}
            .topbar,.ncn-game-sidebar {
              background:var(--ncn-game-calm-nav);
              border-color:var(--ncn-game-calm-line);
              box-shadow:var(--ncn-game-calm-shadow);
            }
            .ncn-game-admin {
              background:var(--ncn-game-calm-control);
              border-color:var(--ncn-game-calm-line);
            }
            .ncn-game-close,#ncn-game-theme,.ncn-game-admin a {
              background:var(--ncn-game-calm-control);
              border-color:var(--ncn-game-calm-line);
              color:var(--ncn-ink);
              box-shadow:none;
            }
            .ncn-game-nav a:hover {background:var(--ncn-game-calm-control);transform:none}
            #ncn-game-menu {
              background:linear-gradient(150deg,#3572b6,#2762a2);
              box-shadow:0 5px 16px rgba(35,85,149,.16),inset 0 1px rgba(255,255,255,.18);
            }
            .ncn-game-sidebar {border-radius:25px}
            .topbar {border-radius:24px}
            @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))) {
              .topbar,.ncn-game-sidebar {
                -webkit-backdrop-filter:blur(12px) saturate(112%);
                backdrop-filter:blur(12px) saturate(112%);
              }
            }
            @media(max-width:900px) {
              .topbar {border-radius:21px}
              .ncn-game-sidebar {border-radius:22px}
              /* Do not change #ncn-game-menu top/left/transform: fixes already applied. */
            }
          }
          @media screen and (prefers-reduced-transparency:reduce),
                 screen and (prefers-contrast:more),
                 screen and (forced-colors:active) {
            .topbar,.ncn-game-sidebar {
              background:var(--ncn-surface)!important;
              -webkit-backdrop-filter:none!important;
              backdrop-filter:none!important;
            }
          }
          /* END NCN GAME SOFT GLASS 20261017-v1 */
          CSS_NCN_GAME
          python3 /tmp/apply_soft_glass.py . apply --assets-dir /tmp --no-backup
          git diff --check
          python3 - <<'PYCHECK'
          from pathlib import Path
          x=Path("public/assets/ncn-theme/site.css").read_text()
          y=Path("public/flappy-bird/site-bridge.css").read_text()
          assert x.count("BEGIN NCN SOFT GLASS 20261017-v1")==1
          assert y.count("BEGIN NCN GAME SOFT GLASS 20261017-v1")==1
          assert "BEGIN NCN MOBILE GLASS 20261017-v1" not in x
          assert "BEGIN NCN GAME MOBILE GLASS 20261017-v1" not in y
          assert "#ncn-game-topbar > #ncn-game-menu" in y
          print("CSS patch integrity OK")
          PYCHECK
      - name: Commit only when preflight passes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/ncn-theme/site.css public/flappy-bird/site-bridge.css
          if git diff --cached --quiet; then
            echo "Already applied. No commit needed."
            exit 0
          fi
          git commit -m "style: unify calm liquid glass across desktop and mobile"
          git push origin HEAD:main
