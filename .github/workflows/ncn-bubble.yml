name: NCN Bubble Shooter
on:
  push:
    branches: [main]
    paths: ['public/ban-bong/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-bubble.test.mjs', 'tests/browser/ncn-bubble.mjs', '.github/workflows/ncn-bubble.yml']
  pull_request:
    paths: ['public/ban-bong/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-bubble.test.mjs', 'tests/browser/ncn-bubble.mjs', '.github/workflows/ncn-bubble.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bubble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --test tests/ncn-bubble.test.mjs tests/ncn-scores.test.mjs tests/ncn-site.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/ncn-bubble.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-bubble
          path: artifacts/bubble/
