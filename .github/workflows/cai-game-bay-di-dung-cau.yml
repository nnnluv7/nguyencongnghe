name: NCN - Cai game Bay Di Dung Cau
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cai game hoac khoi phuc ve truoc'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  arcade:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Cai game hoac khoi phuc
        shell: python
        run: |
          import base64, gzip, hashlib, json, os
          from pathlib import Path
          path=Path('.github/workflows/cai-game-bay-di-dung-cau.yml')
          encoded=''.join(line.partition(':')[2].strip() for line in path.read_text().splitlines() if line.startswith('# NCN_ARCADE_PAYLOAD:'))
          raw=gzip.decompress(base64.b64decode(encoded, validate=True))
          if hashlib.sha256(raw).hexdigest()!='139401136ef6e97cdd7a4b1c719d837f372121bc83d99cbacda08c9d1c5fa38a': raise ValueError('Gói cài đặt bị sửa hoặc thiếu dòng.')
          bundle=json.loads(raw)
          namespace={'__name__':'ncn_arcade_installer'}
          exec(compile(bundle['installer'],'ncn-game-installer.py','exec'), namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc': namespace['restore'](Path.cwd())
          else: namespace['install'](Path.cwd(), {n:base64.b64decode(v,validate=True) for n,v in bundle['files'].items()})
      - name: Kiem tra game va danh muc
        shell: bash
        run: |
          set -euo pipefail
          python -c "import json; from pathlib import Path; c=json.loads(Path('public/assets/ncn-theme/config.json').read_text()); assert isinstance(c['tools'],list)"
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            node --check public/flappy-bird/core.js
            node --check public/flappy-bird/game.js
            node --check public/flappy-bird/site-bridge.js
            node --test tests/ncn-flight.test.cjs
            python -c "import json; from pathlib import Path; c=json.loads(Path('public/assets/ncn-theme/config.json').read_text()); assert sum(t.get('id')=='flappy-bird' for t in c['tools'])==1"
          else
            python -c "import json; from pathlib import Path; c=json.loads(Path('public/assets/ncn-theme/config.json').read_text()); assert not any(t.get('id')=='flappy-bird' for t in c['tools'])"
          fi
      - name: Commit game va danh muc NCN
        shell: bash
        run: |
          set -euo pipefail
          git add -A -- public/flappy-bird/ tests/ncn-flight.test.cjs public/assets/ncn-theme/config.json ncn-game-backup/state.json
          if git diff --cached --quiet; then
            echo "Khong co thay doi, khong kich hoat Netlify build thua."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            git commit -m "revert(ncn): remove flappy arcade integration"
          else
            git commit -m "feat(ncn): add Bay Di Dung Cau arcade and shared theme"
          fi
          git push origin HEAD:"$NCN_BRANCH"

