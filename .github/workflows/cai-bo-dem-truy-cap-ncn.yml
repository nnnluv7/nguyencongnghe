# NCN - Cài bộ đếm chỉ với 1 YAML. Đặt vào .github/workflows/ trên nhánh main.
# Lần đầu upload sẽ tự chạy; cũng có thể vào Actions > Run workflow.
# Tạo backend Netlify + frontend cho các trang dùng theme.js, tự commit lên main.
name: "NCN | Cài bộ đếm online và lượt truy cập"

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cai-bo-dem-truy-cap-ncn.yml"

permissions:
  contents: write

concurrency:
  group: ncn-visitor-counter-installer
  cancel-in-progress: false

jobs:
  cai-dat:
    name: Cài bộ đếm NCN tự động
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
