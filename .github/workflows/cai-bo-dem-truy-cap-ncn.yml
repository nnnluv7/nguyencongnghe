          files = {
              "netlify/functions/ncn-visitors.mjs",
              "netlify/functions/ncn-visitors-cleanup.mjs",
              "netlify/lib/ncn-visitor-counter.mjs",
              "public/assets/ncn-theme/visitor-counter.js",
              "public/assets/ncn-theme/visitor-counter.css",
              "tests/ncn-visitors.test.mjs",
              "docs/ncn-visitor-counter.md",
          }
          entry = Path("public/assets/ncn-theme/theme.js")
          if not entry.is_file():
              raise SystemExit("Không thấy public/assets/ncn-theme/theme.js: sai mã nguồn repo NCN, đã dừng để tránh sửa nhầm.")
          with zipfile.ZipFile(BytesIO(base64.b64decode(payload))) as z:
              assert set(z.namelist()) == files, "Danh sách tệp nhúng không hợp lệ"
              for name in sorted(files):
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  content = z.read(name)
                  # Chỉ ghi lại tệp nếu có thay đổi, cho phép chạy lại YAML nhiều lần.
                  if not target.exists() or target.read_bytes() != content:
                      target.write_bytes(content)
                      print("Cài đặt:", name)
          code = entry.read_text(encoding="utf-8")
          line = "import './visitor-counter.js'; // NCN visitor metrics"
          if line not in code:
              entry.write_text(line + "\n" + code, encoding="utf-8")
              print("Đã bật bộ đếm trên mọi trang dùng theme.js")
          else:
              print("Bộ đếm đã tích hợp trong theme.js")
          PY

      - name: Kiểm tra cú pháp và chạy test
        shell: bash
        run: |
          node --check netlify/lib/ncn-visitor-counter.mjs
          node --check netlify/functions/ncn-visitors.mjs
          node --check netlify/functions/ncn-visitors-cleanup.mjs
          node --check public/assets/ncn-theme/visitor-counter.js
          node --check public/assets/ncn-theme/theme.js
          node --test tests/ncn-visitors.test.mjs

      - name: Lưu thay đổi lên main để Netlify triển khai
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            public/assets/ncn-theme/theme.js \
            public/assets/ncn-theme/visitor-counter.js \
            public/assets/ncn-theme/visitor-counter.css \
            netlify/functions/ncn-visitors.mjs \
            netlify/functions/ncn-visitors-cleanup.mjs \
            netlify/lib/ncn-visitor-counter.mjs \
            tests/ncn-visitors.test.mjs \
            docs/ncn-visitor-counter.md
          if git diff --cached --quiet; then
            echo "Bộ đếm đã được cài; không có thay đổi mới."
          else
            git commit -m "feat(ncn): install visitor counters for Netlify"
            git push origin HEAD:main
          fi
          echo "Hoàn tất. Kiểm tra bản deploy mới trong Netlify."
