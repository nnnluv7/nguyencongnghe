name: NCN - Liquid Glass Dong Bo Toan Site
on:
  workflow_dispatch:
    inputs:
      thao_tac:
        description: "Bật Liquid Glass hoặc khôi phục giao diện cũ"
        type: choice
        required: true
        default: apply
        options:
          - apply
          - rollback
permissions:
  contents: write
concurrency:
  group: ncn-liquid-glass-main
  cancel-in-progress: false
jobs:
  style-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Apply or roll back only NCN styles
        shell: bash
        env:
          ACTION: ${{ inputs.thao_tac }}
        run: |
          cat > /tmp/ncn-glass-patch.py <<'PY'
          #!/usr/bin/env python3
          """Add or roll back a scoped NCN Liquid Glass polish layer.
          Does not touch HTML, JS, identities, Netlify functions, or print styles.
          """
          from pathlib import Path
          import sys

          PORTAL_START = '/* BEGIN NCN UNIFIED LIQUID GLASS 20261017 */'
          PORTAL_END = '/* END NCN UNIFIED LIQUID GLASS 20261017 */'
          GAME_START = '/* BEGIN NCN GAME GLASS POLISH 20261017 */'
          GAME_END = '/* END NCN GAME GLASS POLISH 20261017 */'

          PORTAL = r'''/* BEGIN NCN UNIFIED LIQUID GLASS 20261017 */
          /* NCN: visual surfaces only; no layout, auth flow, VIP checks or print edits. */
          @media screen {
            body.ncn-modern {
              --ncn-unified-panel:rgba(251,253,255,.77);
              --ncn-unified-panel-strong:rgba(252,254,255,.90);
              --ncn-unified-input:rgba(255,255,255,.68);
              --ncn-unified-rim:rgba(255,255,255,.87);
              --ncn-unified-line:rgba(103,145,196,.25);
              --ncn-unified-shadow:0 20px 56px rgba(20,55,96,.13),inset 0 1px rgba(255,255,255,.90),inset 0 -1px rgba(123,156,201,.14);
            }
            html[data-ncn-theme="dark"] body.ncn-modern,
            body.ncn-modern.dark {
              --ncn-unified-panel:rgba(24,39,62,.76);
              --ncn-unified-panel-strong:rgba(27,43,70,.91);
              --ncn-unified-input:rgba(35,54,82,.80);
              --ncn-unified-rim:rgba(203,224,255,.16);
              --ncn-unified-line:rgba(174,203,249,.26);
              --ncn-unified-shadow:0 24px 64px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.10);
            }

            /* Shared navigation, search, drawers and account menu. */
            body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown) {
              background:var(--ncn-unified-panel-strong);
              border-color:var(--ncn-unified-rim);
              box-shadow:var(--ncn-unified-shadow);
            }
            body.ncn-modern :is(.ncn-menu-heading,.ncn-search-dialog-head,.ncn-admin-card) {
              border-color:var(--ncn-unified-line);
            }
            body.ncn-modern :is(.ncn-icon-button,.ncn-account-menu summary,.ncn-admin-links a,.ncn-top-search) {
              background:var(--ncn-unified-input);
              border-color:var(--ncn-unified-rim);
              box-shadow:inset 0 1px rgba(255,255,255,.16);
            }

            /* Login/register/forgot-password UI, without changing display or JS handlers. */
            body.ncn-modern .auth-modal .auth-box {
              background:var(--ncn-unified-panel-strong);
              color:var(--ncn-ink);
              border:1px solid var(--ncn-unified-rim);
              border-radius:28px;
              box-shadow:0 28px 90px rgba(8,24,54,.27),inset 0 1px rgba(255,255,255,.26);
            }
            body.ncn-modern .auth-modal .auth-title { color:var(--ncn-ink);letter-spacing:-.35px; }
            body.ncn-modern .auth-modal .auth-field label { color:var(--ncn-ink); }
            body.ncn-modern .auth-modal .auth-input {
              background:var(--ncn-unified-input);
              color:var(--ncn-ink);
              border:1px solid var(--ncn-unified-line);
              border-radius:14px;
              box-shadow:inset 0 1px 2px rgba(4,31,63,.05);
            }
            body.ncn-modern .auth-modal .auth-input:focus-visible {
              outline:2px solid var(--ncn-accent);
              outline-offset:2px;
            }
            body.ncn-modern .auth-modal .auth-submit {
              border:1px solid rgba(255,255,255,.30);
              border-radius:14px;
              background:linear-gradient(150deg,#367dd8,#185bb0);
              color:#fff;
              box-shadow:0 9px 22px rgba(31,94,172,.24),inset 0 1px rgba(255,255,255,.28);
            }
            body.ncn-modern .auth-modal .auth-close {
              border-radius:50%;
              color:var(--ncn-ink);
            }
            body.ncn-modern .auth-modal .auth-link { color:var(--ncn-accent); }

            /* Forms and content cards: scoped to app chrome, not print/preview stages. */
            body.ncn-modern :is(.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-contact-panel),
            body.ncn-modern #ncn-event-app .ev-panel,
            body.ncn-modern :is(#ncn-sticker-app,#ncn-popup-app,#ncn-store-app) :is(.st-panel:not(.st-preview-panel),.st-card),
            body.ncn-modern #ncn-wheel-app .lw-panel,
            body.ncn-modern #ncn-billing-app :is(.pay-panel,.pay-plan),
            body.ncn-modern #ncn-cash-app :is(.cq-panel,.cq-metric:not(.cq-metric-main)) {
              background:var(--ncn-unified-panel);
              border-color:var(--ncn-unified-rim);
              box-shadow:var(--ncn-unified-shadow);
            }
            body.ncn-modern #ncn-event-app .ev-dialog,
            body.ncn-modern #ncn-cash-app #cq-copy-dialog {
              background:var(--ncn-unified-panel-strong);
              border-color:var(--ncn-unified-rim);
              box-shadow:var(--ncn-unified-shadow);
              border-radius:24px;
            }
            body.ncn-modern :is(#ncn-event-app .ev-field input,#ncn-event-app .ev-field select,
                                  #ncn-sticker-app .st-field input,#ncn-sticker-app .st-field select,
                                  #ncn-popup-app .st-field input,#ncn-popup-app .st-field select,
                                  #ncn-billing-app .pay-form input) {
              border-radius:12px;
              border-color:var(--ncn-unified-line);
              background:var(--ncn-unified-input);
              color:var(--ncn-ink);
            }
            body.ncn-modern :is(#ncn-event-app .ev-button,#ncn-billing-app .pay-btn,
                                #ncn-sticker-app .st-button,#ncn-popup-app .st-button) { border-radius:12px; }

            @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))) {
              body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown,
                                  .auth-modal .auth-box,.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-contact-panel),
              body.ncn-modern #ncn-event-app :is(.ev-panel,.ev-dialog),
              body.ncn-modern :is(#ncn-sticker-app,#ncn-popup-app,#ncn-store-app) :is(.st-panel:not(.st-preview-panel),.st-card),
              body.ncn-modern #ncn-wheel-app .lw-panel,
              body.ncn-modern #ncn-billing-app :is(.pay-panel,.pay-plan),
              body.ncn-modern #ncn-cash-app :is(.cq-panel,.cq-metric:not(.cq-metric-main),#cq-copy-dialog) {
                -webkit-backdrop-filter:blur(22px) saturate(160%);
                backdrop-filter:blur(22px) saturate(160%);
              }
            }
          }
          /* Fallbacks are intentional for reduced transparency, contrast and accessibility. */
          @media screen and (prefers-reduced-transparency:reduce),screen and (prefers-contrast:more),screen and (forced-colors:active) {
            body.ncn-modern :is(#ncn-topbar,#ncn-sidebar,#ncn-page-tools,#ncn-search-dialog,.ncn-account-dropdown,.auth-modal .auth-box),
            body.ncn-modern :is(.ncn-welcome-panel,.ncn-tool-card,.ncn-article-card,.ncn-contact-panel) {
              background:var(--ncn-surface)!important;
              -webkit-backdrop-filter:none!important;
              backdrop-filter:none!important;
            }
          }
          /* END NCN UNIFIED LIQUID GLASS 20261017 */'''

          GAME = r'''/* BEGIN NCN GAME GLASS POLISH 20261017 */
          /* Retain existing layout and game canvas. Only align glass surfaces. */
          @media screen {
            :root {
              --ncn-game-rim:rgba(255,255,255,.78);
              --ncn-game-panel:rgba(250,253,255,.82);
              --ncn-game-strong:rgba(251,253,255,.92);
              --ncn-game-shadow:0 20px 56px rgba(20,55,96,.14),inset 0 1px rgba(255,255,255,.80);
            }
            html[data-ncn-theme="dark"] {
              --ncn-game-rim:rgba(220,235,255,.20);
              --ncn-game-panel:rgba(18,31,52,.85);
              --ncn-game-strong:rgba(20,34,56,.94);
              --ncn-game-shadow:0 24px 64px rgba(0,0,0,.30),inset 0 1px rgba(255,255,255,.10);
            }
            .topbar,.ncn-game-sidebar {
              background:var(--ncn-game-strong);
              border-color:var(--ncn-game-rim);
              box-shadow:var(--ncn-game-shadow);
            }
            .ncn-game-close,#ncn-game-theme,.ncn-game-admin a {
              background:var(--ncn-game-panel);
              border-color:var(--ncn-game-rim);
              color:var(--ncn-ink);
            }
            .ncn-game-sidebar-head,.ncn-game-admin { border-color:var(--ncn-border); }
            .ncn-game-admin { background:var(--ncn-game-panel); }
            @supports ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))) {
              .topbar,.ncn-game-sidebar {
                -webkit-backdrop-filter:blur(24px) saturate(155%);
                backdrop-filter:blur(24px) saturate(155%);
              }
            }
          }
          @media screen and (prefers-reduced-transparency:reduce),screen and (prefers-contrast:more),screen and (forced-colors:active) {
            .topbar,.ncn-game-sidebar{background:var(--ncn-surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
          }
          /* END NCN GAME GLASS POLISH 20261017 */'''

          ROOTS = [(Path('public/assets/ncn-theme/site.css'), PORTAL_START, PORTAL_END, PORTAL),
                   (Path('public/flappy-bird/site-bridge.css'), GAME_START, GAME_END, GAME)]

          def patch(repo: Path, action: str):
              if action not in ('apply', 'rollback'):
                  raise ValueError('action must be apply or rollback')
              pending=[]
              for rel, start, end, content in ROOTS:
                  path = repo / rel
                  if not path.is_file():
                      raise FileNotFoundError(f'Missing expected source file: {rel}')
                  old = path.read_text(encoding='utf-8')
                  sc,ec = old.count(start), old.count(end)
                  if sc != ec or sc > 1:
                      raise ValueError(f'Unmatched/duplicate patch in {rel}: no files written')
                  if action=='apply':
                      new = old if sc else old+'\n'+content+'\n'
                  else:
                      if sc:
                          start_index=old.index(start)
                          end_index=old.index(end)+len(end)
                          if start_index == 0 or old[start_index-1] != '\n' or old[end_index:end_index+1] != '\n':
                              raise ValueError(f'Unexpected patch boundaries in {rel}: no files written')
                          new=old[:start_index-1]+old[end_index+1:]
                      else:
                          new=old
                  if new != old:
                      pending.append((path,new))
              for path,new in pending:
                  path.write_text(new,encoding='utf-8')
              return [str(path.relative_to(repo)) for path,_ in pending]

          if __name__ == '__main__':
              repo=Path(sys.argv[1] if len(sys.argv)>1 else '.').resolve()
              action=sys.argv[2] if len(sys.argv)>2 else 'apply'
              for name in patch(repo,action): print('Updated',name)
          PY
          python3 /tmp/ncn-glass-patch.py . "$ACTION"
          git diff --check
          node --test tests/ncn-flight.test.cjs tests/ncn-gvgs.test.mjs tests/ncn-visitors.test.mjs
      - name: Commit only CSS after successful tests
        shell: bash
        env:
          ACTION: ${{ inputs.thao_tac }}
        run: |
          git add public/assets/ncn-theme/site.css public/flappy-bird/site-bridge.css
          if git diff --cached --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "style(ncn): $ACTION scoped liquid-glass surfaces"
          git push origin HEAD:main
