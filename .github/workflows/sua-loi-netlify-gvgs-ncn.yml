name: Sua loi Netlify GVGS NCN
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  fix-netlify-gvgs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sua dung 2 tep GVGS
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          raw=gzip.decompress(base64.b64decode(""))
          if hashlib.sha256(raw).hexdigest()!="586423c8ef4678b235e25c2866a095e16deec9ff803671eea1d111d9a516f213":raise ValueError('Tep cai dat bi cat/sua; sao chep lai toan bo .txt.')
          payload=json.loads(raw)
          ns={"__name__":"ncn_gvgs_bundle_fix"}
          exec(compile(payload['installer'],'sua-loi-gvgs.py','exec'),ns)
          ns['install'](Path.cwd(),{name:base64.b64decode(value)for name,value in payload['files'].items()},payload['meta'])
          (Path(os.environ['RUNNER_TEMP'])/'ncn-verify-netlify.mjs').write_text(payload['verify'])
      - name: Cai thu vien va bo dong goi Netlify de kiem tra
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm install --prefix "$RUNNER_TEMP/ncn-netlify-check" --ignore-scripts --no-audit --no-fund --save-exact @netlify/zip-it-and-ship-it@16.3.0
      - name: Dong goi thu toan bo Functions
        run: NCN_ZISI_DIR="$RUNNER_TEMP/ncn-netlify-check" NCN_BUNDLE_DIR="$RUNNER_TEMP/ncn-function-bundles" node "$RUNNER_TEMP/ncn-verify-netlify.mjs"
      - name: Luu ban sua
        run: |
          git add -- netlify/functions/ncn-gvgs.mjs netlify/lib/ncn-gvgs-private/gv2-assets.cjs
          if [ -d ncn-netlify-gvgs-fix-backup ]; then git add -A -- ncn-netlify-gvgs-fix-backup; fi
          if git diff --cached --quiet; then
            echo "Da co ban sua; khong can tao commit moi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ncn): limit GV-2 resource tracing for Netlify"
          git push origin HEAD:"$NCN_BRANCH"
