name: Cai Popup va giao dien NCN
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  popup-giao-dien:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon cua website
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cai Popup va giao dien, kiem tra truoc khi ghi
        shell: python
        run: |
          import base64,concurrent.futures,gzip,hashlib,json,time,urllib.request
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          files={name:base64.b64decode(data) for name,data in payload["files"].items()}
          def download(item):
              name,metadata=item
              cached=Path(name)
              if cached.is_file():
                  data=cached.read_bytes()
                  if hashlib.sha256(data).hexdigest()==metadata["sha256"]:return name,data
              for attempt in range(3):
                  try:
                      request=urllib.request.Request(metadata["url"],headers={"User-Agent":"Mozilla/5.0 NCN-popup-installer"})
                      with urllib.request.urlopen(request,timeout=40) as response:data=response.read()
                      if hashlib.sha256(data).hexdigest()!=metadata["sha256"]:raise ValueError("Tai nguyen sai phien ban: "+name)
                      return name,data
                  except Exception:
                      if attempt==2:raise
                      time.sleep(1+attempt)
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              for name,data in pool.map(download,payload["downloads"].items()):files[name]=data
          namespace={"__name__":"ncn_combined_installer"}
          exec(compile(payload["driver"],"ncn-combined.py","exec"),namespace)
          namespace["install_combined"](Path.cwd(),files,payload["sources"])
      - name: Kiem tra dung 4 trang Popup va trang chu
        run: |
          node --check public/assets/ncn-popup/core.js
          node --check public/assets/ncn-popup/app.js
          node --check public/assets/ncn-theme/theme.js
          test -f public/index.html
          test -f public/p/popup-a7.html
          test -f public/popup-a7/index.html
          test -f public/p/popup-a4-a5-a6.html
          test -f public/popup-a4-a5-a6/index.html
          test -f public/thu-vien/index.html
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
      - name: Luu cap nhat vao nhanh cua website
        run: |
          git add public ncn-theme-backup
          if git diff --cached --quiet; then
            echo "Popup va giao dien da o dung phien ban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Cai Popup 32 mau va giao dien NCN"
          git push origin HEAD:"$NCN_BRANCH"
