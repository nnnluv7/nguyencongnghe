name: Cai Popup Ban hang Trang tri NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cai bo cong cu moi hoac khoi phuc truoc lan cai'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  cong-cu-cua-hang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Chuan bi mau in va cap nhat ba muc
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_store_installer"}
          exec(compile(payload["installer"],"ncn-store-install.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd())
          else:
              files={name:base64.b64decode(data) for name,data in payload["files"].items()}
              files=namespace["download_assets"](Path.cwd(),files,payload["assets"])
              namespace["install"](Path.cwd(),files)
      - name: Kiem tra pham vi va ma chay
        run: |
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            node --check public/assets/ncn-store-tools/core.js
            node --check public/assets/ncn-store-tools/app.js
            test -f public/assets/ncn-store-tools/catalogue.json
          fi
          test -f public/ban-hang/index.html
          test -f public/trang-tri/index.html
          test -f public/popup-a4-a5-a6/index.html
          git diff --quiet -- .github/workflows netlify package.json package-lock.json netlify.toml
          git diff --quiet -- public/assets/js public/assets/css public/assets/ncn-sticker public/assets/ncn-cash public/assets/ncn-theme/theme.js public/assets/ncn-theme/theme.css public/assets/ncn-theme/title-fix.css public/assets/ncn-vip-auth.js public/assets/ncn-popup/core.js public/assets/ncn-popup/app.js public/assets/ncn-popup/style.css public/in-event public/2025/05/tu-van.html
      - name: Luu bo cong cu len nhanh cua website
        run: |
          git add public ncn-store-tools-backup
          if git diff --cached --quiet; then
            echo "Bo cong cu da o dung phien ban."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Them Gio Vang 2 va cap nhat Ban hang Trang tri NCN"
          git push origin HEAD:"$NCN_BRANCH"
