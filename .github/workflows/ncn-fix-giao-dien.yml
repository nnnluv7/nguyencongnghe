name: NCN - Kiem tra va sua dong bo giao dien
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-ui-fix-main
  cancel-in-progress: false

jobs:
  fix-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lay ma nguon nhanh main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Dung Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Cai dependencies
        run: npm ci --ignore-scripts
      - name: Sua giao dien va dong bo menu game
        shell: bash
        run: |
          cat > /tmp/ncn-repair.py <<'NCN_SCRIPT'
          #!/usr/bin/env python3
          """NCN safe UI repair. Does not alter Netlify Functions, VIP or payment logic."""
          from pathlib import Path
          import json
          import sys

          MARKER = "/* BEGIN NCN GAME LAYOUT SYNC 20261017-v3 */"
          VERSION = "20261017-unified-ui-3"

          CSS = r"""
          /* BEGIN NCN GAME LAYOUT SYNC 20261017-v3 */
          /* Mirror the portal's floating header/menu dimensions without touching game physics. */
          :root {
            --ncn-ui-rim:rgba(255,255,255,.94);
            --ncn-ui-glass:rgba(255,255,255,.88);
            --ncn-ui-strong:rgba(255,255,255,.96);
            --ncn-ui-soft:rgba(235,243,254,.86);
            --ncn-ui-shadow:0 12px 40px rgba(34,58,99,.10),0 2px 7px rgba(34,58,99,.05),inset 0 1px 0 rgba(255,255,255,.95);
            --ncn-ui-shadow-high:0 24px 70px rgba(13,34,65,.20);
          }
          html[data-ncn-theme="dark"] {
            --ncn-ui-rim:rgba(220,235,255,.20);
            --ncn-ui-glass:rgba(18,31,52,.90);
            --ncn-ui-strong:rgba(20,34,56,.97);
            --ncn-ui-soft:rgba(55,77,109,.42);
            --ncn-ui-shadow:0 12px 40px rgba(0,0,0,.24),inset 0 1px 0 rgba(255,255,255,.11);
            --ncn-ui-shadow-high:0 24px 70px rgba(0,0,0,.40);
          }
          .topbar{
            top:12px;left:max(12px,calc((100vw - 1392px)/2));right:max(12px,calc((100vw - 1392px)/2));bottom:auto;
            height:68px;padding:0 16px;gap:22px;border:1px solid var(--ncn-ui-rim);
            border-radius:28px;background:var(--ncn-ui-glass);
            box-shadow:var(--ncn-ui-shadow);
            -webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);
          }
          .app{padding-top:88px}
          .topbar .brand{margin-left:104px}
          .topbar .ncn-game-brand-image{border-radius:14px}
          #ncn-game-menu{
            top:24px;left:max(24px,calc((100vw - 1392px)/2 + 12px));padding:10px 16px;
            min-height:44px;min-width:96px;border:1px solid #ffffff55;border-radius:999px;
            background:linear-gradient(150deg,#2869c6,#1455ae);
            box-shadow:0 5px 15px #1455ae30,inset 0 1px 0 #ffffff77,inset 0 -1px 0 #0a3b8f44;
          }
          #ncn-game-menu:hover{background:linear-gradient(150deg,#2c70cb,#1455ae)}
          .ncn-game-sidebar{
            width:350px;border-radius:28px;border-color:var(--ncn-ui-rim);
            background:var(--ncn-ui-strong);box-shadow:var(--ncn-ui-shadow-high);
            -webkit-backdrop-filter:blur(24px) saturate(155%);backdrop-filter:blur(24px) saturate(155%);
          }
          .ncn-game-nav a{border-radius:16px;min-height:46px}
          .ncn-game-close{border:1px solid var(--ncn-ui-rim);border-radius:50%;background:var(--ncn-ui-soft)}
          #ncn-game-theme{border-color:var(--ncn-ui-rim);border-radius:50%;background:var(--ncn-ui-soft);color:var(--ncn-ink)}
          @media(max-width:900px){
            .topbar{top:8px;left:8px;right:8px;height:64px;padding:0 12px;gap:12px;border-radius:25px}
            .topbar .brand{margin-left:56px}
            #ncn-game-menu{top:18px;left:20px;width:44px;min-width:44px;border-radius:50%;padding:10px}
            .app{padding-top:80px}
          }
          @media(max-width:620px){
            .topbar{padding:0 10px;gap:7px}
            .topbar .brand{margin-left:54px}
            #ncn-game-menu{left:20px}
            .app{padding:80px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
            .ncn-game-sidebar{border-radius:26px}
            .ncn-game-tools{flex-wrap:wrap}
            .ncn-game-page-title{margin-right:auto}
          }
          @media(max-width:360px){
            .topbar .ncn-game-brand-copy strong{font-size:16px}
            .topbar .top-actions{gap:4px}
          }
          @media(prefers-reduced-transparency:reduce),(prefers-contrast:more),(forced-colors:active){
            .topbar,.ncn-game-sidebar{background:var(--ncn-surface);-webkit-backdrop-filter:none;backdrop-filter:none}
          }
          @media(prefers-reduced-motion:reduce){
            .topbar,#ncn-game-menu,.ncn-game-sidebar{transition:none!important}
          }
          /* END NCN GAME LAYOUT SYNC 20261017-v3 */
          """

          def patch(root: Path) -> list:
              targets = {
                  "css": root / "public/flappy-bird/site-bridge.css",
                  "js": root / "public/flappy-bird/site-bridge.js",
                  "html": root / "public/flappy-bird/index.html",
                  "config": root / "public/assets/ncn-theme/config.json",
              }
              missing = [str(path) for path in targets.values() if not path.is_file()]
              if missing:
                  raise RuntimeError("Missing expected file(s): " + ", ".join(missing))

              source = {key: path.read_text(encoding="utf-8") for key,path in targets.items()}
              original = dict(source)
              if not all(token in source["css"] for token in (".topbar", ".ncn-game-sidebar", "#ncn-game-menu")):
                  raise RuntimeError("CSS layout has changed; no edits made.")
              if "populate({tools:[]});" not in source["js"] and "/* NCN FALLBACK TOOL LIST 20261017-v3 */" not in source["js"]:
                  raise RuntimeError("Game navigation structure changed; no edits made.")
              if "site-bridge.css?v=" not in source["html"] or "site-bridge.js?v=" not in source["html"]:
                  raise RuntimeError("Game HTML structure changed; no edits made.")

              cfg = json.loads(source["config"])
              tools = cfg.get("tools")
              if not isinstance(tools,list) or not tools:
                  raise RuntimeError("Portal config missing tools; no edits made.")
              ids=set()
              fallback=[]
              for t in tools:
                  if not isinstance(t,dict) or not all(isinstance(t.get(k),str) for k in ("id","title","href")):
                      raise RuntimeError("Invalid tool entry; no edits made.")
                  if t["id"] in ids:
                      raise RuntimeError("Duplicate tool id; no edits made.")
                  ids.add(t["id"])
                  fallback.append({k:t[k] for k in ("id","title","href","access") if k in t})
              if "flappy-bird" not in ids:
                  raise RuntimeError("Game was removed from portal config; no edits made.")

              if MARKER not in source["css"]:
                  source["css"] = source["css"].rstrip() + "\n\n" + CSS.strip() + "\n"

              fallback_marker="/* NCN FALLBACK TOOL LIST 20261017-v3 */"
              if fallback_marker not in source["js"]:
                  replacement=fallback_marker+"\n  populate({tools:"+json.dumps(fallback,ensure_ascii=False,separators=(",",":"))+"});"
                  source["js"]=source["js"].replace("populate({tools:[]});",replacement,1)

              import re
              for ext in ("css","js"):
                  source["html"],count = re.subn(
                      r'(site-bridge\.'+ext+r'\?v=)[0-9A-Za-z_-]+',
                      lambda m: m.group(1)+VERSION,source["html"],count=1,
                  )
                  if count!=1:
                      raise RuntimeError("Could not update game cache version; no edits made.")
              if source["js"].count(fallback_marker)!=1 or source["css"].count(MARKER)!=1:
                  raise RuntimeError("Duplicate patch marker; no edits made.")
              if source["html"].count(VERSION)!=2:
                  raise RuntimeError("Unexpected game cache references; no edits made.")

              changes=[(key,targets[key],source[key]) for key in ("css","js","html") if source[key]!=original[key]]
              # Preflight succeeded; now write. Running the script twice should make no further changes.
              for key,path,content in changes:
                  path.write_text(content,encoding="utf-8")
              return [str(path.relative_to(root)) for _,path,_ in changes]

          if __name__ == "__main__":
              try:
                  base=Path(sys.argv[1] if len(sys.argv)>1 else ".").resolve()
                  changes=patch(base)
                  print("Changed:", ", ".join(changes) if changes else "none (already applied)")
              except Exception as exc:
                  print("NCN UI patch aborted:",exc,file=sys.stderr)
                  sys.exit(1)
          NCN_SCRIPT
          python3 /tmp/ncn-repair.py .
          git diff --check
          node --check public/flappy-bird/site-bridge.js
          node --test tests/ncn-flight.test.cjs tests/ncn-gvgs.test.mjs tests/ncn-visitors.test.mjs
      - name: Chi commit neu da qua kiem tra
        shell: bash
        run: |
          if git diff --quiet -- public/flappy-bird/index.html public/flappy-bird/site-bridge.css public/flappy-bird/site-bridge.js; then
            echo "Khong co thay doi moi; patch da duoc ap dung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/flappy-bird/index.html public/flappy-bird/site-bridge.css public/flappy-bird/site-bridge.js
          git commit -m "fix(ui): align NCN game header menu and theme, add full offline fallback"
          git push origin HEAD:main
