name: NCN Gold Miner
on:
  push:
    branches: [main]
    paths: ['public/dao-vang/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-gold.test.mjs', 'tests/browser/ncn-gold.mjs', '.github/workflows/ncn-gold.yml']
  pull_request:
    paths: ['public/dao-vang/**', 'public/assets/ncn-arcade/**', 'public/xep-hinh/fullscreen.js', 'netlify/lib/ncn-scores-api.mjs', 'tests/ncn-gold.test.mjs', 'tests/browser/ncn-gold.mjs', '.github/workflows/ncn-gold.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gold:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --test tests/ncn-gold.test.mjs tests/ncn-scores.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/ncn-gold.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-gold
          path: artifacts/gold/
          retention-days: 14
