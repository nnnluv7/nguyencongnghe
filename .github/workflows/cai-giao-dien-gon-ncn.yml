name: Cai giao dien gon va GV-2 NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cai giao dien gon + GV-2 hoac quay lai ban truoc'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  easy-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cai giao dien hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/cai-giao-dien-gon-ncn.yml').read_text()
          encoded=''.join(line.split(':',1)[1].strip() for line in source.splitlines() if line.startswith('# NCN_PAYLOAD_V1:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!="a663f02ca2e0b81689292e026b24641512c2849b7ddc564935f87ff9410ae77e":raise ValueError('Goi cap nhat bi cat hoac sua. Sao chep lai toan bo tep .txt.')
          payload=json.loads(raw)
          namespace={"__name__":"ncn_easy_ui_installer"}
          exec(compile(payload["installer"],"cai-giao-dien-gon.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd())
          else:namespace["install"](Path.cwd(),{n:base64.b64decode(v) for n,v in payload["files"].items()},payload["meta"])
      - name: Kiem tra code va giu thanh toan, bo dem, bo may in
        shell: python
        run: |
          import json,subprocess,tomllib
          from pathlib import Path
          names=['public/assets/ncn-theme/theme.js','public/assets/ncn-theme/easy-ui.js','public/assets/ncn-theme/cards.js','public/assets/ncn-theme/visitor-counter.js','public/assets/ncn-sticker/app.js','public/assets/ncn-popup/app.js','public/assets/ncn-store-tools/app.js','netlify/lib/ncn-gvgs-private/core.cjs','netlify/lib/ncn-gvgs-private/ui.js','netlify/functions/ncn-gvgs.mjs']
          for name in names:
            if Path(name).is_file():subprocess.run(['node','--check',name],check=True)
          tomllib.loads(Path('netlify.toml').read_text())
          json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          kept=['netlify.toml','package.json','package-lock.json','public/assets/ncn-theme/config.json','netlify/lib/ncn-event-api.mjs','netlify/lib/ncn-membership.mjs','netlify/lib/ncn-billing-api.mjs','netlify/functions/ncn-billing.mjs','netlify/functions/ncn-sepay-webhook.mjs','netlify/functions/ncn-event.mjs','netlify/functions/ncn-visitors.mjs','netlify/functions/ncn-visitors-cleanup.mjs','netlify/lib/ncn-visitor-counter.mjs','public/assets/ncn-billing.js','public/assets/ncn-identity-client.js','public/assets/ncn-cash','public/assets/ncn-direct','public/assets/ncn-sticker/core.js','public/assets/ncn-popup/core.js','public/assets/ncn-store-tools/core.js','public/assets/ncn-theme/mobile.js','public/assets/ncn-theme/mobile.css','public/assets/ncn-theme/theme.css','netlify/lib/ncn-event-private']
          subprocess.run(['git','diff','--exit-code','--',*kept],check=True)
      - name: Luu ma nguon
        run: |
          git add -A -- public netlify ncn-easy-ui-backup
          if git diff --cached --quiet; then
            echo "Khong co thay doi can luu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            git commit -m "revert(ncn): restore previous NCN layout"
          else
            git commit -m "feat(ncn): simplify tools and add large GV-2 layout"
          fi
          git push origin HEAD:"$NCN_BRANCH"

