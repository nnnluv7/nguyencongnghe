name: NCN Color Blocks Arcade
on:
  push:
    branches: [main]
    paths: ['public/xep-hinh/**', 'public/pikachu/wake-lock.js', 'public/assets/ncn-theme/**', 'tests/ncn-xep-hinh.test.mjs', 'tests/browser/ncn-xep-hinh.mjs', '.github/workflows/ncn-xep-hinh.yml']
  pull_request:
    paths: ['public/xep-hinh/**', 'public/pikachu/wake-lock.js', 'public/assets/ncn-theme/**', 'tests/ncn-xep-hinh.test.mjs', 'tests/browser/ncn-xep-hinh.mjs', '.github/workflows/ncn-xep-hinh.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  color-blocks:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node --check public/xep-hinh/game.js && node --check public/xep-hinh/render.js && node --check public/xep-hinh/fullscreen.js && node --test tests/ncn-xep-hinh.test.mjs tests/ncn-pikachu-awake.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser/ncn-xep-hinh.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-color-blocks-arcade
          path: artifacts/xep-hinh/
          retention-days: 14
