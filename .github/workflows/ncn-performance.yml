name: NCN production asset performance
on:
  push:
    branches: [main]
    paths: ['public/**', 'netlify/**', 'scripts/build-public.mjs', 'tests/**', 'package.json', 'netlify.toml', '.github/workflows/ncn-performance.yml']
  pull_request:
    paths: ['public/**', 'netlify/**', 'scripts/build-public.mjs', 'tests/**', 'package.json', 'netlify.toml', '.github/workflows/ncn-performance.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  built-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1 @netlify/zip-it-and-ship-it@16.5.1
      - run: node scripts/build-public.mjs
      - run: node tests/ncn-performance-build.mjs
      - run: node --test tests/ncn-performance.test.mjs
      - run: node tests/netlify-pack.mjs
      - run: npx playwright install --with-deps chromium
      - name: Compare cold and repeated frontend loads on the same simulated mobile connection
        run: node tests/browser/ncn-performance.mjs
      - name: Verify on-demand Excel, actual private editor imports, font metrics and every primary tool route
        run: |
          node tests/browser/ncn-tool-resources.mjs
          node tests/browser/ncn-tools-performance.mjs
      - name: Verify the actual compiled account, photos, VIP state, all six games and public layouts
        env:
          NCN_BUILT_TEST: '1'
        run: |
          node tests/browser/ncn-profile.mjs
          node tests/browser/ncn-account.mjs
          node tests/browser/ncn-arcade.mjs
          node tests/browser/ncn-layout.mjs
          node tests/browser/ncn-scroll-ui.mjs
      - name: Verify glass contrast, accessibility, unchanged geometry and print pixels
        run: node tests/browser/ncn-glass.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-built-performance
          path: |
            artifacts/performance/
            artifacts/performance-tools/
            artifacts/tool-resources/
            artifacts/profile-built/
            artifacts/arcade-built/
            artifacts/layout-built/
            artifacts/scroll-ui/built/
            artifacts/glass/
            artifacts/netlify-pack/results.json
          retention-days: 14
