name: Cai menu noi va chao mung NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cai menu noi hoac khoi phuc giao dien truoc ban nay'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  floating-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cai menu hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/cai-menu-noi-ncn.yml').read_text()
          encoded=''.join(line.split(':',1)[1].strip() for line in source.splitlines() if line.startswith('# NCN_PAYLOAD_V1:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='d0076dbd88c39cd37e68fabb7131430c5a07b835007e24c9e355dca3e238de5c':raise ValueError('Goi cap nhat bi cat hoac sua. Can sao chep TOAN BO tep .txt.')
          payload=json.loads(raw)
          namespace={'__name__':'ncn_floating_menu_installer'}
          exec(compile(payload['installer'],'cai-menu-noi.py','exec'),namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc':namespace['restore'](Path.cwd())
          else:namespace['install'](Path.cwd(),{n:base64.b64decode(v,validate=True) for n,v in payload['files'].items()},payload['meta'])
      - name: Kiem tra menu, lien he va giu cong cu VIP
        shell: python
        run: |
          import json,os,re,subprocess,tomllib
          from pathlib import Path
          tomllib.loads(Path('netlify.toml').read_text())
          cfg=json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          names=['public/assets/ncn-theme/theme.js','public/assets/ncn-theme/tool-ui.js','public/assets/ncn-theme/menu.js'] if os.environ.get('NCN_ACTION')!='khoi-phuc' else ['public/assets/ncn-theme/theme.js','public/assets/ncn-theme/easy-ui.js']
          for name in names:subprocess.run(['node','--check',name],check=True)
          if os.environ.get('NCN_ACTION')!='khoi-phuc':
            assert [t['id'] for t in cfg['tools'][:4]]==['event','gvgs','cash','insurance']
            assert cfg['adminContact']['line']=='https://line.me/ti/p/C9-ixFOSeY'
            assert cfg['adminContact']['groupLine']=='https://line.me/ti/g/EJP2yCnSVM'
            pages=[p for p in Path('public').rglob('*.html') if 'BEGIN NCN MODERN SHELL' in p.read_text()]
            for p in pages:
              text=p.read_text()
              assert text.count('id="ncn-menu-open"')==1,str(p)
              assert 'ncn-floating-ui' in text and 'ncn-nav-more' not in text,str(p)
              assert text.count('id="ncn-site-style"')==1,str(p)
              assert '/assets/ncn-theme/site.css?v=20261016-floating-1' in text,str(p)
              assert 'id="ncn-initial-config"' in text,str(p)
              assert 'https://line.me/ti/p/C9-ixFOSeY' in text and 'https://line.me/ti/g/EJP2yCnSVM' in text,str(p)
            assert 'id="ncn-welcome-panel"' in Path('public/index.html').read_text()
            bridge=Path('public/assets/ncn-theme/easy-ui.js').read_text()
            assert len(bridge)<200 and 'installToolUI as installEasyUI' in bridge
            print('Da kiem tra menu, thu tu va lien he tren',len(pages),'trang.')
          kept=['netlify','netlify.toml','package.json','package-lock.json','public/_headers','public/_redirects','public/assets/ncn-theme/mobile.js','public/assets/ncn-theme/visitor-counter.js','public/assets/ncn-theme/visitor-counter.css','public/assets/ncn-billing.js','public/assets/ncn-identity-client.js','public/assets/ncn-gvgs.css','public/assets/ncn-gvgs-auth.js','public/assets/ncn-cash','public/assets/ncn-direct','public/assets/ncn-sticker','public/assets/ncn-popup','public/assets/ncn-store-tools','public/assets/ncn-wheel']
          subprocess.run(['git','diff','--exit-code','--',*kept],check=True)
      - name: Luu cac tep da doi vao nhanh chinh
        shell: python
        run: |
          import gzip,json,os,subprocess
          from pathlib import Path
          backup=Path('ncn-floating-menu-backup/state.json.gz')
          if not backup.exists():
            print('Khong co thay doi can luu.')
          else:
            state=json.loads(gzip.decompress(backup.read_bytes()))
            paths=sorted(set(state['installed'])|set(state['before'])|set(state['html_edits'])|{'public/assets/ncn-theme/config.json',backup.as_posix()})
            tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split(chr(0)))
            paths=[p for p in paths if Path(p).exists() or p in tracked]
            subprocess.run(['git','add','-A','--',*paths],check=True)
            result=subprocess.run(['git','diff','--cached','--quiet'])
            if result.returncode==1:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              message='revert(ncn): restore interface before floating menu' if os.environ.get('NCN_ACTION')=='khoi-phuc' else 'feat(ncn): unify floating menu, welcome and admin contacts'
              subprocess.run(['git','commit','-m',message],check=True)
              subprocess.run(['git','push','origin','HEAD:'+os.environ['NCN_BRANCH']],check=True)
            elif result.returncode!=0:raise RuntimeError('Khong kiem tra duoc git diff.')
            else:print('Da cap nhat, khong co thay doi moi.')

