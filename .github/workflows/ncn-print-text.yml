name: NCN print text
on:
  pull_request:
    paths:
      - 'public/**/*.html'
      - 'public/assets/ncn-sticker/**'
      - 'public/assets/ncn-popup/**'
      - 'public/assets/ncn-store-tools/**'
      - 'public/assets/ncn-direct/**'
      - 'netlify/lib/ncn-*-private/**'
      - 'tests/browser/ncn-print-text.mjs'
      - 'tests/browser/ncn-print-defaults.mjs'
      - 'tests/browser/ncn-print-return.mjs'
      - 'tests/browser/ncn-print-history.mjs'
      - '.github/workflows/ncn-print-text.yml'
  push:
    branches: [main]
    paths:
      - 'public/**/*.html'
      - 'public/assets/ncn-sticker/**'
      - 'public/assets/ncn-popup/**'
      - 'public/assets/ncn-store-tools/**'
      - 'public/assets/ncn-direct/**'
      - 'netlify/lib/ncn-*-private/**'
      - 'tests/browser/ncn-print-text.mjs'
      - 'tests/browser/ncn-print-defaults.mjs'
      - 'tests/browser/ncn-print-return.mjs'
      - 'tests/browser/ncn-print-history.mjs'
      - '.github/workflows/ncn-print-text.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - run: node scripts/build-public.mjs
      - name: Verify real Back and Choose navigation without child history entries
        env:
          NCN_PRINT_BROWSER: ${{ matrix.engine }}
        run: node tests/browser/ncn-print-history.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-print-history-${{ matrix.engine }}
          path: artifacts/print-history/
          retention-days: 14
  text:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspect all printable text in preview and print
        run: node tests/browser/ncn-print-text.mjs
      - name: Verify real numeric defaults and independent label editing
        run: |
          node scripts/build-public.mjs
          node tests/browser/ncn-print-defaults.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ncn-print-text
          path: |
            artifacts/print-text/
            artifacts/print-defaults/
          retention-days: 14
