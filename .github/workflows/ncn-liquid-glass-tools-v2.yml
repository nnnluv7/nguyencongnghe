name: NCN Liquid Glass Tools v2
'on':
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cập nhật 5 trang công cụ hoặc khôi phục trước bản v2'
        type: choice
        required: true
        default: cap-nhat
        options:
          - cap-nhat
          - khoi-phuc
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  liquid-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Lấy mã nguồn nhánh đã chọn
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Chuẩn bị Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cập nhật Liquid Glass v2 hoặc khôi phục
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ncn-liquid-tools-v2.py" <<'PYTHON_NCN_TOOLS'
          #!/usr/bin/env python3
          """Self-contained NCN tools UI update with a guarded, exact restore point."""
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile

          VERSION = '20261023-v2'
          BACKUP = '.github/ncn-liquid-tools-20261023-v2-backup.json'
          CSS = 'public/assets/ncn-theme/site.css'
          BEGIN = '/* BEGIN NCN COMPACT TOOLS LIQUID GLASS 20261023-v2 */'
          END = '/* END NCN COMPACT TOOLS LIQUID GLASS 20261023-v2 */'
          PREVIOUS_BEGIN = '/* BEGIN NCN LIQUID GLASS 20261023-v1 */'
          PREVIOUS_END = '/* END NCN LIQUID GLASS 20261023-v1 */'
          TARGETS = (CSS, 'public/assets/ncn-theme/tool-ui.js', 'public/assets/ncn-wheel/app.js')
          PAYLOAD = ''
          PAYLOAD_SHA256 = '7595316f4ece4f918162cd6abdf6f35c6b1e6387d06fadce28f52d2ede0c9c8a'


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def checked_path(root, relative):
              path = root / relative
              if path.is_symlink() or any(p.is_symlink() for p in path.parents if p != root.parent):
                  raise ValueError('Không hỗ trợ đường dẫn liên kết: ' + relative)
              if not path.resolve().is_relative_to(root):
                  raise ValueError('Đường dẫn nằm ngoài kho mã nguồn: ' + relative)
              if path.exists() and not path.is_file():
                  raise ValueError('Đường dẫn không phải tệp: ' + relative)
              return path


          def read_optional(path):
              return path.read_bytes() if path.exists() else None


          def atomic_write(path, data):
              if data is None:
                  if path.exists():
                      path.unlink()
                  return
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, temporary = tempfile.mkstemp(prefix='.ncn-tools-', dir=path.parent)
              try:
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
                  os.chmod(temporary, 0o644)
                  os.replace(temporary, path)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)


          def write_transaction(root, changes):
              paths = {relative: checked_path(root, relative) for relative in changes}
              before = {relative: read_optional(path) for relative, path in paths.items()}
              written = []
              try:
                  for relative, data in changes.items():
                      if before[relative] != data:
                          atomic_write(paths[relative], data)
                          written.append(relative)
              except Exception:
                  for relative in reversed(written):
                      atomic_write(paths[relative], before[relative])
                  raise
              return written


          def payload():
              raw = gzip.decompress(base64.b64decode(PAYLOAD, validate=True))
              if digest(raw) != PAYLOAD_SHA256:
                  raise ValueError('Gói giao diện bị thay đổi hoặc tải chưa đầy đủ.')
              data = json.loads(raw)
              if set(data) != {'files', 'base_sha256'} or set(data['files']) != set(TARGETS) or set(data['base_sha256']) != set(TARGETS[1:]):
                  raise ValueError('Danh sách tệp giao diện không hợp lệ.')
              return {relative: content.encode('utf-8') for relative, content in data['files'].items()}, data['base_sha256']


          def read_backup(root):
              path = checked_path(root, BACKUP)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('version') != VERSION or set(data.get('files', {})) != set(TARGETS):
                  raise ValueError('Bản sao lưu không đúng phiên bản; dừng để tránh ghi đè.')
              for relative, info in data['files'].items():
                  current = read_optional(checked_path(root, relative))
                  if current is None or digest(current) != info['applied_sha256']:
                      raise ValueError('Tệp đã đổi sau khi cài bản v2: ' + relative + '. Dừng để giữ phần chỉnh sửa mới.')
              return data


          def patch_css(original, patch):
              if original is None:
                  raise ValueError('Không tìm thấy tệp giao diện: ' + CSS)
              source = original.decode('utf-8')
              count_begin, count_end = source.count(BEGIN), source.count(END)
              if count_begin or count_end:
                  if count_begin != 1 or count_end != 1 or source.index(BEGIN) >= source.index(END):
                      raise ValueError('Dấu mốc CSS v2 bị thiếu hoặc lặp; chưa ghi tệp nào.')
                  current = source[source.index(BEGIN):source.index(END) + len(END)]
                  if current != patch.decode('utf-8').strip():
                      raise ValueError('CSS v2 đã được chỉnh riêng; dừng để giữ phần chỉnh sửa đó.')
                  return original
              if source.count(PREVIOUS_BEGIN) != 1 or source.count(PREVIOUS_END) != 1 or source.index(PREVIOUS_BEGIN) >= source.index(PREVIOUS_END):
                  raise ValueError('Cần có giao diện NCN Liquid Glass v1 trước khi cài bản công cụ v2.')
              separator = '\n' if source.endswith('\n') else '\n\n'
              return (source + separator + patch.decode('utf-8').strip() + '\n').encode('utf-8')


          def install(root):
              root = root.resolve()
              existing_backup = read_backup(root)
              bundled, supported_hashes = payload()
              before, after = {}, {}
              for relative in TARGETS:
                  original = read_optional(checked_path(root, relative))
                  before[relative] = original
                  if relative == CSS:
                      after[relative] = patch_css(original, bundled[relative])
                  else:
                      if original is None or (original != bundled[relative] and digest(original) != supported_hashes[relative]):
                          raise ValueError('Mã nguồn đã khác phiên bản hỗ trợ: ' + relative + '. Chưa ghi tệp nào; cần ghép phần sửa mới trước.')
                      after[relative] = bundled[relative]
              if before == after:
                  print('Các công cụ đã đúng bản Liquid Glass v2; không tạo thêm commit.')
                  return []
              if existing_backup:
                  raise ValueError('Đã có bản sao lưu v2; không ghi đè bản sao lưu.')
              backup = {'version': VERSION, 'files': {}}
              for relative in TARGETS:
                  backup['files'][relative] = {
                      'original_sha256': digest(before[relative]),
                      'original_gzip_base64': base64.b64encode(gzip.compress(before[relative], mtime=0)).decode('ascii'),
                      'applied_sha256': digest(after[relative]),
                  }
              changes = {BACKUP: (json.dumps(backup, ensure_ascii=False, indent=2) + '\n').encode('utf-8'), **after}
              written = write_transaction(root, changes)
              print('Đã cập nhật 5 trang công cụ Liquid Glass v2 và lưu bản khôi phục.')
              return written


          def restore(root):
              root = root.resolve()
              backup = read_backup(root)
              if backup is None:
                  raise ValueError('Không có bản sao lưu của lần cài v2 từ workflow này.')
              changes = {}
              for relative, info in backup['files'].items():
                  original = gzip.decompress(base64.b64decode(info['original_gzip_base64'], validate=True))
                  if digest(original) != info['original_sha256']:
                      raise ValueError('Bản sao lưu bị thay đổi: ' + relative)
                  changes[relative] = original
              changes[BACKUP] = None
              written = write_transaction(root, changes)
              print('Đã khôi phục đúng giao diện trước lần cài v2.')
              return written


          def stage(root):
              allowed = set(TARGETS) | {BACKUP}
              changed = subprocess.check_output(
                  ['git', 'ls-files', '-z', '--modified', '--deleted', '--others', '--exclude-standard', '--', *sorted(allowed)], cwd=root
              ).decode('utf-8').split('\0')
              paths = sorted({path for path in changed if path})
              if not set(paths).issubset(allowed):
                  raise ValueError('Có tệp ngoài phạm vi giao diện; dừng tạo commit.')
              if paths:
                  subprocess.run(['git', 'add', '--all', '--', *paths], cwd=root, check=True)
              return paths


          if __name__ == '__main__':
              try:
                  mode = sys.argv[1] if len(sys.argv) == 2 else ''
                  if mode not in ('cap-nhat', 'khoi-phuc', 'stage'):
                      raise ValueError('Tác vụ không hợp lệ.')
                  {'cap-nhat': install, 'khoi-phuc': restore, 'stage': stage}[mode](Path.cwd())
              except (ValueError, KeyError, TypeError, OSError, EOFError, subprocess.SubprocessError) as error:
                  print('::error::' + str(error), file=sys.stderr)
                  raise SystemExit(1)
          PYTHON_NCN_TOOLS
          python3 "$RUNNER_TEMP/ncn-liquid-tools-v2.py" "$NCN_ACTION"
      - name: Kiểm tra mã và các chức năng hiện có
        shell: bash
        run: |
          test -s public/index.html
          node --check --input-type=module < public/assets/ncn-theme/tool-ui.js
          node --check --input-type=module < public/assets/ncn-wheel/app.js
          node --test tests/ncn-flight.test.cjs tests/ncn-visitors.test.mjs tests/ncn-gvgs.test.mjs
          git diff --check
      - name: Lưu giao diện vào nhánh đã chọn
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/ncn-liquid-tools-v2.py" stage
          if git diff --cached --quiet; then
            echo "Các công cụ đã đúng phiên bản; không có thay đổi cần lưu." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            NCN_MESSAGE="style: restore tools before NCN Liquid Glass v2"
          else
            NCN_MESSAGE="style: compact five tools with NCN Liquid Glass v2"
          fi
          git commit -m "$NCN_MESSAGE"
          git push origin "HEAD:refs/heads/$NCN_BRANCH"
          echo "Đã lưu giao diện công cụ. Kiểm tra lần triển khai website tương ứng trên Netlify." >> "$GITHUB_STEP_SUMMARY"
