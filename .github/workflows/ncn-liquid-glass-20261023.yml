name: NCN Liquid Glass 20261023
'on':
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cài giao diện hoặc khôi phục trước lần cài'
        type: choice
        required: true
        default: cap-nhat
        options:
          - cap-nhat
          - khoi-phuc
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  liquid-glass:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Lấy mã nguồn nhánh đã chọn
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Chuẩn bị Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cài giao diện hoặc khôi phục
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ncn-liquid-glass-install.py" <<'PYTHON_NCN_LIQUID'
          #!/usr/bin/env python3
          """NCN Liquid Glass: self-contained visual patch and guarded restoration."""
          from pathlib import Path
          import base64
          import gzip
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile

          VERSION = '20261023-v1'
          BACKUP = '.github/ncn-liquid-glass-20261023-backup.json'
          CSS_MARKERS = {
              'public/assets/ncn-theme/site.css': [
                  ('/* BEGIN NCN SOFT GLASS 20261017-v1 */', '/* END NCN SOFT GLASS 20261017-v1 */'),
                  ('/* BEGIN NCN LIQUID GLASS 20261023-v1 */', '/* END NCN LIQUID GLASS 20261023-v1 */'),
              ],
              'public/flappy-bird/site-bridge.css': [
                  ('/* BEGIN NCN GAME SOFT GLASS 20261017-v1 */', '/* END NCN GAME SOFT GLASS 20261017-v1 */'),
                  ('/* BEGIN NCN GAME LIQUID GLASS 20261023-v1 */', '/* END NCN GAME LIQUID GLASS 20261023-v1 */'),
              ],
          }
          TARGETS = tuple(CSS_MARKERS) + (
              'public/assets/ncn-theme/liquid-wallpaper.svg',
              'public/assets/ncn-theme/liquid-orbit.svg',
          )
          PAYLOAD = ''
          PAYLOAD_SHA256 = '8e8366e9a807b00778d1669130ce3afa46562053a33eafd036df2886ca97af29'


          def digest(data):
              return hashlib.sha256(data).hexdigest()


          def checked_path(root, relative):
              path = root / relative
              if path.is_symlink() or any(p.is_symlink() for p in path.parents if p != root.parent):
                  raise ValueError('Không hỗ trợ đường dẫn liên kết: ' + relative)
              if not path.resolve().is_relative_to(root):
                  raise ValueError('Đường dẫn nằm ngoài kho mã nguồn: ' + relative)
              if path.exists() and not path.is_file():
                  raise ValueError('Đường dẫn không phải tệp: ' + relative)
              return path


          def read_optional(path):
              return path.read_bytes() if path.exists() else None


          def atomic_write(path, data):
              if data is None:
                  if path.exists():
                      path.unlink()
                  return
              path.parent.mkdir(parents=True, exist_ok=True)
              fd, temporary = tempfile.mkstemp(prefix='.ncn-liquid-', dir=path.parent)
              try:
                  with os.fdopen(fd, 'wb') as stream:
                      stream.write(data)
                  os.chmod(temporary, 0o644)
                  os.replace(temporary, path)
              finally:
                  if os.path.exists(temporary):
                      os.unlink(temporary)


          def write_transaction(root, changes):
              paths = {relative: checked_path(root, relative) for relative in changes}
              before = {relative: read_optional(path) for relative, path in paths.items()}
              written = []
              try:
                  for relative, data in changes.items():
                      if before[relative] != data:
                          atomic_write(paths[relative], data)
                          written.append(relative)
              except Exception:
                  for relative in reversed(written):
                      atomic_write(paths[relative], before[relative])
                  raise
              return written


          def payload():
              raw = gzip.decompress(base64.b64decode(PAYLOAD, validate=True))
              if digest(raw) != PAYLOAD_SHA256:
                  raise ValueError('Gói giao diện bị thay đổi hoặc tải chưa đầy đủ.')
              data = json.loads(raw)
              if set(data) != set(TARGETS):
                  raise ValueError('Danh sách tệp giao diện không hợp lệ.')
              return {relative: content.encode('utf-8') for relative, content in data.items()}


          def read_backup(root):
              path = checked_path(root, BACKUP)
              if not path.exists():
                  return None
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('version') != VERSION or set(data.get('files', {})) != set(TARGETS):
                  raise ValueError('Bản sao lưu không đúng phiên bản; dừng để tránh ghi đè.')
              for relative, info in data['files'].items():
                  current = read_optional(checked_path(root, relative))
                  if current is None or digest(current) != info['applied_sha256']:
                      raise ValueError('Tệp đã đổi sau khi cài Liquid Glass: ' + relative + '. Giữ nguyên tệp để anh kiểm tra trước.')
              return data


          def patch_css(original, patch, pairs, relative):
              if original is None:
                  raise ValueError('Không tìm thấy tệp giao diện: ' + relative)
              source = original.decode('utf-8')
              matching = []
              for begin, end in pairs:
                  count_begin, count_end = source.count(begin), source.count(end)
                  if count_begin or count_end:
                      if count_begin != 1 or count_end != 1 or source.index(begin) >= source.index(end):
                          raise ValueError('Dấu mốc CSS bị thiếu hoặc lặp: ' + relative)
                      matching.append((begin, end))
              if len(matching) != 1:
                  raise ValueError('Cấu trúc giao diện đã khác phiên bản hỗ trợ: ' + relative)
              begin, end = matching[0]
              start = source.index(begin)
              stop = source.index(end) + len(end)
              tail = source[stop:]
              if not tail.strip():
                  tail = '\n'
              return (source[:start] + patch.decode('utf-8').rstrip('\n') + tail).encode('utf-8')


          def install(root):
              root = root.resolve()
              existing_backup = read_backup(root)
              bundled = payload()
              before, after = {}, {}
              for relative in TARGETS:
                  before[relative] = read_optional(checked_path(root, relative))
                  after[relative] = patch_css(before[relative], bundled[relative], CSS_MARKERS[relative], relative) if relative in CSS_MARKERS else bundled[relative]
              if before == after:
                  print('Giao diện đã đúng phiên bản Liquid Glass; không cần cập nhật.')
                  return []
              if existing_backup:
                  raise ValueError('Đã có bản sao lưu của lần cài trước; không ghi đè bản sao lưu.')
              backup = {'version': VERSION, 'files': {}}
              for relative in TARGETS:
                  original = before[relative]
                  backup['files'][relative] = {
                      'existed': original is not None,
                      'original_sha256': digest(original) if original is not None else None,
                      'original_gzip_base64': base64.b64encode(gzip.compress(original, mtime=0)).decode('ascii') if original is not None else None,
                      'applied_sha256': digest(after[relative]),
                  }
              # Validate everything before writing. Store the restore point in the same commit.
              changes = {BACKUP: (json.dumps(backup, ensure_ascii=False, indent=2) + '\n').encode('utf-8'), **after}
              written = write_transaction(root, changes)
              print('Đã cài giao diện Liquid Glass và lưu bản khôi phục.')
              return written


          def restore(root):
              root = root.resolve()
              backup = read_backup(root)
              if backup is None:
                  raise ValueError('Không có bản sao lưu từ workflow này. Nếu đã gộp PR giao diện, dùng Revert của PR để khôi phục.')
              changes = {}
              for relative, info in backup['files'].items():
                  if info['existed']:
                      original = gzip.decompress(base64.b64decode(info['original_gzip_base64'], validate=True))
                      if digest(original) != info['original_sha256']:
                          raise ValueError('Bản sao lưu bị thay đổi: ' + relative)
                      changes[relative] = original
                  else:
                      changes[relative] = None
              changes[BACKUP] = None
              written = write_transaction(root, changes)
              print('Đã khôi phục đúng giao diện trước lần cài Liquid Glass.')
              return written


          def stage(root):
              allowed = set(TARGETS) | {BACKUP}
              changed = subprocess.check_output(
                  ['git', 'ls-files', '-z', '--modified', '--deleted', '--others', '--exclude-standard', '--', *sorted(allowed)], cwd=root
              ).decode('utf-8').split('\0')
              paths = sorted({path for path in changed if path})
              if not set(paths).issubset(allowed):
                  raise ValueError('Có tệp ngoài phạm vi giao diện; dừng tạo commit.')
              if paths:
                  subprocess.run(['git', 'add', '--all', '--', *paths], cwd=root, check=True)
              return paths


          if __name__ == '__main__':
              try:
                  mode = sys.argv[1] if len(sys.argv) == 2 else ''
                  if mode not in ('cap-nhat', 'khoi-phuc', 'stage'):
                      raise ValueError('Tác vụ không hợp lệ.')
                  {'cap-nhat': install, 'khoi-phuc': restore, 'stage': stage}[mode](Path.cwd())
              except (ValueError, KeyError, OSError, subprocess.SubprocessError) as error:
                  print('::error::' + str(error), file=sys.stderr)
                  raise SystemExit(1)
          PYTHON_NCN_LIQUID
          python3 "$RUNNER_TEMP/ncn-liquid-glass-install.py" "$NCN_ACTION"
      - name: Kiểm tra các chức năng hiện có
        shell: bash
        run: |
          test -s public/index.html
          node --test tests/ncn-flight.test.cjs tests/ncn-visitors.test.mjs tests/ncn-gvgs.test.mjs
          git diff --check
      - name: Lưu thay đổi giao diện
        shell: bash
        run: |
          python3 "$RUNNER_TEMP/ncn-liquid-glass-install.py" stage
          if git diff --cached --quiet; then
            echo "Giao diện đã đúng phiên bản; không có thay đổi cần lưu." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$NCN_ACTION" = "khoi-phuc" ]; then
            NCN_MESSAGE="style: restore theme before NCN Liquid Glass 20261023"
          else
            NCN_MESSAGE="style: apply NCN Liquid Glass 20261023"
          fi
          git commit -m "$NCN_MESSAGE"
          git push origin "HEAD:refs/heads/$NCN_BRANCH"
          echo "Đã lưu thay đổi giao diện. Xem trạng thái triển khai của website trên Netlify." >> "$GITHUB_STEP_SUMMARY"
