name: Don giao dien cu NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Don giao dien cu hoac khoi phuc truoc lan don nay'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  one-theme:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Don giao dien hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,hashlib,json,os
          from pathlib import Path
          source=Path('.github/workflows/don-giao-dien-cu-ncn.yml').read_text()
          encoded=''.join(line.split(':',1)[1].strip() for line in source.splitlines() if line.startswith('# NCN_PAYLOAD_V1:'))
          raw=gzip.decompress(base64.b64decode(encoded,validate=True))
          if hashlib.sha256(raw).hexdigest()!='3f91bccdb172064f320153239c83c611c8dc12674b74d84c171e91a59fba0ede':raise ValueError('Goi cap nhat bi cat hoac sua. Can sao chep TOAN BO tep .txt.')
          payload=json.loads(raw)
          namespace={"__name__":"ncn_one_theme_installer"}
          exec(compile(payload['installer'],'don-giao-dien-cu.py','exec'),namespace)
          if os.environ.get('NCN_ACTION')=='khoi-phuc':namespace['restore'](Path.cwd())
          else:namespace['install'](Path.cwd(),{n:base64.b64decode(v,validate=True) for n,v in payload['files'].items()},payload['meta'])
      - name: Kiem tra giao dien va giu cong cu, VIP, thanh toan
        shell: python
        run: |
          import gzip,json,os,re,subprocess,tomllib
          from pathlib import Path
          root=Path.cwd()
          for name in ['public/assets/ncn-theme/theme.js','public/assets/ncn-theme/easy-ui.js','netlify/functions/ncn-gvgs.mjs','netlify/lib/ncn-gvgs-private/gv2-assets.cjs']:
            subprocess.run(['node','--check',name],check=True)
          tomllib.loads(Path('netlify.toml').read_text())
          json.loads(Path('public/assets/ncn-theme/config.json').read_text())
          if os.environ.get('NCN_ACTION')!='khoi-phuc':
            pages=[p for p in Path('public').rglob('*.html') if 'BEGIN NCN MODERN SHELL' in p.read_text()]
            for p in pages:
              text=p.read_text()
              assert re.search(r'<body[^>]*class="[^"]*\bncn-easy\b',text),str(p)
              assert text.count('id="ncn-easy-style"')==1,str(p)
              assert '/assets/ncn-theme/site.css?v=20261016-one-theme-1' in text,str(p)
              assert not re.search(r'ncn-theme/(theme|mobile|title-fix|easy-ui)\.css',text),str(p)
              assert 'class="ncn-brand ncn-header-brand"' in text,str(p)
            assert pages,'Khong tim thay trang giao dien'
            assert Path('public/_headers').is_file() and Path('public/_redirects').is_file()
            print('Da kiem tra giao dien ban dau tren',len(pages),'trang.')
          kept=['netlify','netlify.toml','package.json','package-lock.json','public/assets/ncn-theme/config.json','public/assets/ncn-theme/mobile.js','public/assets/ncn-theme/visitor-counter.js','public/assets/ncn-theme/visitor-counter.css','public/assets/ncn-billing.js','public/assets/ncn-identity-client.js','public/assets/ncn-gvgs.css','public/assets/ncn-gvgs-auth.js','public/assets/ncn-cash','public/assets/ncn-direct','public/assets/ncn-sticker','public/assets/ncn-popup','public/assets/ncn-store-tools']
          subprocess.run(['git','diff','--exit-code','--',*kept],check=True)
      - name: Luu cac tep da doi vao nhanh chinh
        shell: python
        run: |
          import gzip,json,os,subprocess
          from pathlib import Path
          backup=Path('ncn-one-theme-backup/state.json.gz')
          if not backup.exists():
            print('Khong co thay doi can luu.')
          else:
            state=json.loads(gzip.decompress(backup.read_bytes()))
            paths=sorted(set(state['installed'])|set(state['before'])|set(state['html_edits'])|{backup.as_posix()})
            tracked=set(subprocess.check_output(['git','ls-files','-z']).decode().split('\0'))
            paths=[p for p in paths if Path(p).exists() or p in tracked]
            subprocess.run(['git','add','-A','--',*paths],check=True)
            result=subprocess.run(['git','diff','--cached','--quiet'])
            if result.returncode==1:
              subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
              subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
              message='revert(ncn): restore layout before theme cleanup' if os.environ.get('NCN_ACTION')=='khoi-phuc' else 'fix(ncn): render one current theme before JavaScript'
              subprocess.run(['git','commit','-m',message],check=True)
              subprocess.run(['git','push','origin','HEAD:'+os.environ['NCN_BRANCH']],check=True)
            elif result.returncode!=0:raise RuntimeError('Khong kiem tra duoc git diff.')
            else:print('Da cap nhat, khong co thay doi moi.')

