name: Them cong cu Event NCN

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ncn-event-install
  cancel-in-progress: false

jobs:
  install:
    if: github.repository == 'nnnluv7/nguyencongnghe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Lay ma nguon main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Them trang Event va menu
        shell: bash
        run: |
          python3 - <<'NCN_EVENT_PY'
          import base64, gzip
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET


          def install(root, files):
              public = Path(root) / "public"
              if not (public / "index.html").is_file():
                  raise SystemExit("Khong tim thay public/index.html. Kiem tra dung kho nguyencongnghe.")
              allowed = {
                  "public/in-event/index.html",
                  "public/assets/ncn-event-core.js",
                  "public/assets/ncn-event.js",
                  "public/assets/ncn-event.css",
                  "public/downloads/ncn-event-bridge.user.js",
              }
              if set(files) != allowed:
                  raise SystemExit("Goi Event khong hop le.")
              changes = {}
              for relative, content in files.items():
                  changes[Path(root) / relative] = content

              nav = '<li itemprop="name" role="tab"><a href="/in-event/" itemprop="url">_Event: Sticker gạch giá</a></li>'
              patched = 0
              menu_pattern = re.compile(r'(<ul\b[^>]*\bid=["\']original-menuList["\'][^>]*>)([\s\S]*?)(</ul>)', re.I)
              sticker_pattern = re.compile(r'(<li\b[^>]*>\s*<a\b[^>]*>\s*_Sticker\s*</a>\s*</li>)', re.I)
              for p in public.rglob("*.html"):
                  text = changes.get(p, p.read_text(encoding="utf-8"))
                  def patch_menu(match):
                      nonlocal patched
                      body = match.group(2)
                      if re.search(r'href=["\']/in-event/?["\']', body):
                          return match.group(0)
                      found = sticker_pattern.search(body)
                      if found:
                          body = body[:found.end()] + nav + body[found.end():]
                      else:
                          body += nav
                      patched += 1
                      return match.group(1) + body + match.group(3)
                  updated = menu_pattern.sub(patch_menu, text, count=1)
                  if updated != text:
                      changes[p] = updated

              catalog = public / "assets/catalog.js"
              if catalog.is_file():
                  text = catalog.read_text(encoding="utf-8")
                  match = re.fullmatch(r"\s*window\.CG_CATALOG\s*=\s*([\s\S]+?)\s*;\s*", text)
                  if match:
                      try:
                          entries = json.loads(match.group(1))
                      except json.JSONDecodeError:
                          entries = None
                      if isinstance(entries, list):
                          entry = {
                              "title": "Event: Sticker gạch giá",
                              "link": "/in-event/",
                              "thumbnail": {"src": "https://i.ibb.co/vg5gwhS/Bie-u-tru-ng-NCN-co-ng-nghe-to-i-gia-n.png", "type": "image"},
                              "author": "NCN", "authorimage": "", "date": "14 tháng 10",
                              "datetime": "2026-10-14T05:07:26+07:00",
                              "summary": "Nhập tồn kho, ghép bảng giá event, tìm sản phẩm và in sticker gạch giá.",
                              "labels": ["Tools", "In Ấn"], "category": "Công cụ", "isPage": False
                          }
                          entries = [e for e in entries if e.get("link") not in ["/in-event", "/in-event/"]]
                          entries.insert(0, entry)
                          updated = "window.CG_CATALOG = " + json.dumps(entries, ensure_ascii=False) + ";\n"
                          if updated != text:
                              changes[catalog] = updated
                  else:
                      print("Khong cap nhat danh muc tim kiem: catalog.js da duoc tuy chinh. Menu Event van duoc them.")

              routes = public / "assets/routes.json"
              if routes.is_file():
                  try:
                      entries = json.loads(routes.read_text(encoding="utf-8"))
                      if isinstance(entries, list) and not any(e.get("path") in ["/in-event", "/in-event/"] for e in entries):
                          entries.append({"path": "/in-event/", "file": "in-event/index.html", "title": "Event: Sticker gạch giá", "kind": "tool"})
                          changes[routes] = json.dumps(entries, ensure_ascii=False, indent=2) + "\n"
                  except (json.JSONDecodeError, AttributeError):
                      print("Khong cap nhat routes.json da tuy chinh.")

              sitemap = public / "sitemap.xml"
              if sitemap.is_file():
                  text = sitemap.read_text(encoding="utf-8")
                  if "https://nguyencongnghe.com/in-event/" not in text:
                      addition = "<url><loc>https://nguyencongnghe.com/in-event/</loc><lastmod>2026-10-14</lastmod></url>"
                      updated = text.replace("</urlset>", addition + "</urlset>", 1)
                      if updated != text:
                          ET.fromstring(updated)
                          changes[sitemap] = updated

              written = []
              for p, text in changes.items():
                  if p.is_file() and p.read_text(encoding="utf-8") == text:
                      continue
                  p.parent.mkdir(parents=True, exist_ok=True)
                  p.write_text(text, encoding="utf-8")
                  written.append(str(p.relative_to(root)))
              summary = {"module_files": len(files), "menus_added": patched, "changed_files": len(written)}
              print(json.dumps(summary, ensure_ascii=False))
              return summary

          files = json.loads(gzip.decompress(base64.b64decode('')).decode('utf-8'))
          install(Path('.'), files)
          NCN_EVENT_PY
      - name: Kiem tra JavaScript va tep
        shell: bash
        run: |
          node --check public/assets/ncn-event-core.js
          node --check public/assets/ncn-event.js
          node --check public/downloads/ncn-event-bridge.user.js
          node --check public/assets/catalog.js
          test -f public/in-event/index.html
          test -f public/assets/ncn-event.css
      - name: Luu cap nhat len main
        shell: bash
        run: |
          git add -- public
          if git diff --cached --quiet; then
            echo "Cong cu Event da o phien ban nay."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Them cong cu Event NCN: nhap Excel, ghep gia va in sticker"
          git push origin HEAD:main
