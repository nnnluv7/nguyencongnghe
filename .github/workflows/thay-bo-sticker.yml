name: Thay bo Sticker NCN
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ncn-sticker-install
  cancel-in-progress: false
jobs:
  thay-sticker:
    if: github.repository == 'nnnluv7/nguyencongnghe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cai bo Sticker 25 mau va chuyen cac trang cu
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import html,json,re
          
          ASSET_PREFIX='public/assets/ncn-sticker/'
          FRAGMENT='sticker-fragment.html'
          STYLE='<link rel="stylesheet" href="/assets/ncn-sticker/style.css?v=20261014-1"/>'
          SCRIPT='<script type="module" src="/assets/ncn-sticker/app.js?v=20261014-1"></script>'
          ALIASES={
           '/2022/06/sticker-bao-hiem-xe-may-dan-ao-66k.html':'/sticker/?nhom=bao-hiem',
           '/2022/09/sticker-may-cu-tu-phone.html':'/sticker/?nhom=khac',
           '/2022/09/a4-gia-cheo-1.html':'/sticker/?mau=gc-gach-1&co=1',
           '/2023/11/sticker-giam-gia-1pc.html':'/sticker/?mau=gg2&co=3',
           '/2023/10/sticker-giam-gia-2pcs.html':'/sticker/?mau=gg2&co=2',
           '/2022/11/sticker-giam-gia-6pcs-a4.html':'/sticker/?mau=gg2&co=1',
           '/2022/11/sticker-giam-gia-12-pcs-a4.html':'/sticker/?mau=gg2&co=1',
           '/2022/11/sticker-giam-phan-tram-6pcs.html':'/sticker/?mau=ptg&co=1',
           '/2022/11/sticker-giam-phan-tram-12pcs.html':'/sticker/?mau=ptg&co=1'
          }
          
          class BodyFinder(HTMLParser):
           def __init__(self,text):
            super().__init__(convert_charrefs=False)
            self.offsets=[0]
            for line in text.splitlines(keepends=True):self.offsets.append(self.offsets[-1]+len(line))
            self.depth=0;self.start=None;self.end=None;self.feed(text)
           def position(self):
            line,column=self.getpos();return self.offsets[line-1]+column
           def handle_starttag(self,tag,attrs):
            if self.end is not None:return
            if self.depth:
             if tag=='div':self.depth+=1
            elif tag=='div' and dict(attrs).get('id')=='postBody':
             self.start=self.position()+len(self.get_starttag_text());self.depth=1
           def handle_endtag(self,tag):
            if self.depth and tag=='div':
             self.depth-=1
             if self.depth==0:self.end=self.position()
          
          def patch_page(text,fragment):
           finder=BodyFinder(text)
           if finder.start is None or finder.end is None:raise ValueError('Trang Sticker thiếu khối postBody. Không ghi đè trang khác.')
           text=text[:finder.start]+'\n'+fragment.strip()+'\n'+text[finder.end:]
           def body_class(match):
            tag=match.group(0)
            found=re.search(r'\bclass\s*=\s*([\'"])(.*?)\1',tag,re.S|re.I)
            if found:
             classes=found.group(2).split()
             if 'ncn-sticker-page' not in classes:classes.append('ncn-sticker-page')
             return tag[:found.start(2)]+' '.join(classes)+tag[found.end(2):]
            return tag[:-1]+' class="ncn-sticker-page">'
           text=re.sub(r'<body\b[^>]*>',body_class,text,count=1,flags=re.I)
           if '/assets/ncn-sticker/style.css' not in text:text=text.replace('</head>',STYLE+'\n</head>',1)
           if '/assets/ncn-sticker/app.js' not in text:text=text.replace('</body>',SCRIPT+'\n</body>',1)
           if STYLE not in text or SCRIPT not in text:raise ValueError('Trang Sticker thiếu cấu trúc head/body hoặc có phiên bản tùy chỉnh chưa phù hợp.')
           text=text.replace('https://nguyencongnghe.com/p/sticker.html','https://nguyencongnghe.com/sticker/')
           return text
          
          def redirect_page(target,vip):
           auth='<script type="module" src="/assets/ncn-vip-auth.js"></script>' if vip else ''
           return '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bộ sticker · nguyencongnghe.com</title><meta name="robots" content="noindex"><meta http-equiv="refresh" content="0;url='+html.escape(target,quote=True)+'"><link rel="canonical" href="https://nguyencongnghe.com/sticker/"></head><body><p>Bộ sticker đã được cập nhật. <a href="'+html.escape(target,quote=True)+'">Mở bộ sticker mới</a>.</p>'+auth+'<script>location.replace('+json.dumps(target)+'+location.hash);</script></body></html>\n'
          
          def rewrite_links(text):
           def update(match):
            value=html.unescape(match.group(2));parts=urlsplit(value)
            if parts.netloc and parts.netloc.lower() not in {'nguyencongnghe.com','www.nguyencongnghe.com','chuyengia.vip','www.chuyengia.vip'}:return match.group(0)
            replacement=ALIASES.get(parts.path)
            if replacement:return 'href='+match.group(1)+html.escape(replacement,quote=True)+match.group(1)
            return match.group(0)
           return re.sub(r'\bhref\s*=\s*([\'"])(.*?)\1',update,text,flags=re.I|re.S)
          
          def install(root,files):
           root=Path(root);public=root/'public'
           if not (public/'index.html').is_file():raise SystemExit('Không tìm thấy public/index.html trong kho mã.')
           for name in files:
            path=Path(name)
            if path.is_absolute() or '..' in path.parts or (name!=FRAGMENT and not name.startswith(ASSET_PREFIX)):
             raise SystemExit('Gói cập nhật có tệp ngoài phạm vi Sticker.')
           required={FRAGMENT,*[ASSET_PREFIX+x for x in ['app.js','core.js','style.css','catalogue.json']]}
           if not required.issubset(files):raise SystemExit('Gói cập nhật chưa đủ tệp Sticker.')
           data=json.loads(files[ASSET_PREFIX+'catalogue.json'])
           if len(data['models'])!=25 or len(data['layouts'])!=35:raise SystemExit('Danh mục Sticker chưa đủ mẫu.')
           for a in data['assets']:
            relative='public'+a['path']
            if relative not in files:raise SystemExit('Thiếu tài nguyên in: '+relative)
            import hashlib
            if hashlib.sha256(files[relative]).hexdigest()!=a['sha256']:raise SystemExit('Tài nguyên in sai phiên bản: '+relative)
           templatefile=public/'p/sticker.html'
           if not templatefile.exists():templatefile=public/'sticker/index.html'
           if not templatefile.exists():raise SystemExit('Không tìm thấy trang Sticker hiện tại để giữ giao diện của anh.')
           fragment=files[FRAGMENT].decode('utf8')
           if not (public/'in-event/index.html').exists():fragment=re.sub(r'\s*<a class="st-link" href="/in-event/">.*?</a>','',fragment)
           template=templatefile.read_text()
           planned={root/name:content for name,content in files.items() if name!=FRAGMENT}
           for relative in ['p/sticker.html','sticker/index.html']:
            page=public/relative
            original=page.read_text() if page.exists() else template
            planned[page]=patch_page(original,fragment).encode('utf8')
           vip=(public/'assets/ncn-vip-auth.js').exists()
           for old,target in ALIASES.items():planned[public/old.lstrip('/')]=redirect_page(target,vip).encode('utf8')
           linked=0
           for page in public.rglob('*.html'):
            original=planned.get(page,page.read_bytes()).decode('utf8')
            new=rewrite_links(original)
            if new!=original:planned[page]=new.encode('utf8');linked+=1
           catalogfile=public/'assets/catalog.js'
           if catalogfile.exists():
            content=catalogfile.read_text()
            match=re.fullmatch(r'\s*window\.CG_CATALOG\s*=\s*(\[[\s\S]*\])\s*;?\s*',content)
            if not match:raise SystemExit('Danh mục tìm kiếm có cấu trúc tùy chỉnh. Cần ghép mục Sticker trước khi cập nhật.')
            catalog=json.loads(match.group(1))
            catalog=[row for row in catalog if urlsplit(row.get('link','')).path not in {*ALIASES,'/p/sticker.html','/sticker','/sticker/'}]
            first=data['models'][0]
            catalog.append({'title':'Bộ sticker','link':'/sticker/','thumbnail':{'src':first['thumbnail'],'type':'image'},'author':'NCN','authorimage':'','date':'14 tháng 10','datetime':'2026-10-14T00:00:00+07:00','summary':'25 mẫu sticker, 35 bản in: giảm giá, phiếu mua hàng, trả chậm, bảo hiểm và đặc quyền.','labels':['Tools','In Ấn'],'category':'Công cụ','isPage':True})
            planned[catalogfile]=('window.CG_CATALOG = '+json.dumps(catalog,ensure_ascii=False)+';\n').encode('utf8')
           routesfile=public/'assets/routes.json'
           if routesfile.exists():
            routes=json.loads(routesfile.read_text())
            if not isinstance(routes,list):raise SystemExit('Danh sách đường dẫn có cấu trúc tùy chỉnh.')
            routes=[row for row in routes if row.get('path') not in ALIASES]
            for row in routes:
             if row.get('path') in {'/p/sticker.html','/sticker','/sticker/'}:row.update(title='Bộ sticker',kind='page')
            if not any(row.get('path')=='/sticker/' for row in routes):routes.append({'path':'/sticker/','file':'sticker/index.html','title':'Bộ sticker','kind':'page'})
            planned[routesfile]=(json.dumps(routes,ensure_ascii=False,indent=2)+'\n').encode('utf8')
           sitemapfile=public/'sitemap.xml'
           if sitemapfile.exists():
            sitemap=sitemapfile.read_text()
            def trim_old(match):
             loc=re.search(r'<loc>(.*?)</loc>',match.group(0))
             return '' if loc and urlsplit(html.unescape(loc.group(1))).path in ALIASES else match.group(0)
            sitemap=re.sub(r'\s*<url>\s*<loc>[^<]*</loc>[\s\S]*?</url>',trim_old,sitemap)
            if 'https://nguyencongnghe.com/sticker/</loc>' not in sitemap:sitemap=sitemap.replace('</urlset>','  <url><loc>https://nguyencongnghe.com/sticker/</loc></url>\n</urlset>')
            planned[sitemapfile]=sitemap.encode('utf8')
           changed=[]
           for path,content in planned.items():
            if path.exists() and path.read_bytes()==content:continue
            path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(content);changed.append(str(path.relative_to(root)))
           result={'changed':len(changed),'sticker_models':25,'print_layouts':35,'legacy_pages':len(ALIASES),'updated_link_pages':linked}
           print(json.dumps(result,ensure_ascii=False));return result
          
