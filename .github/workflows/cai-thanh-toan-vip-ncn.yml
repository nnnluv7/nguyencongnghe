name: Cai thanh toan VIP NCN
on:
  workflow_dispatch:
    inputs:
      tac_vu:
        description: 'Cai thanh toan SePay hoac thao module'
        type: choice
        options:
          - cap-nhat
          - khoi-phuc
        default: cap-nhat
      chap_nhan_ngung_vip_tra_phi:
        description: 'CHI cho khoi-phuc: toi da xu ly quyen loi khach, chap nhan ngung VIP tra phi'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ncn-theme-install
  cancel-in-progress: false
jobs:
  vip-payment:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NCN_ACTION: ${{ inputs.tac_vu }}
      NCN_RESTORE_ACK: ${{ inputs.chap_nhan_ngung_vip_tra_phi }}
      NCN_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Lay ma nguon moi nhat
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Dung Node 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Cai thanh toan VIP hoac khoi phuc
        shell: python
        run: |
          import base64,gzip,json,os
          from pathlib import Path
          payload=json.loads(gzip.decompress(base64.b64decode("")))
          namespace={"__name__":"ncn_billing_installer"}
          exec(compile(payload["installer"],"cai-thanh-toan-vip.py","exec"),namespace)
          if os.environ.get("NCN_ACTION")=="khoi-phuc":namespace["restore"](Path.cwd(),os.environ.get("NCN_RESTORE_ACK")=="true")
          else:namespace["install"](Path.cwd(),{n:base64.b64decode(v) for n,v in payload["files"].items()},payload["meta"])
      - name: Kiem tra cu phap va giu cac cong cu hien co
        run: |
          node --check netlify/functions/ncn-event.mjs
          node --check netlify/functions/ncn-gvgs.mjs
          node --check netlify/lib/ncn-event-api.mjs
          node --check public/assets/ncn-vip-auth.js
          node --check public/assets/ncn-gvgs-auth.js
          if [ "$NCN_ACTION" = "cap-nhat" ]; then
            node --check netlify/functions/ncn-billing.mjs
            node --check netlify/functions/ncn-sepay-webhook.mjs
            node --check netlify/lib/ncn-billing-api.mjs
            node --check netlify/lib/ncn-membership.mjs
            node --check public/assets/ncn-billing.js
            node --check public/assets/ncn-identity-client.js
          fi
          python3 -c 'import tomllib,pathlib,json; tomllib.loads(pathlib.Path("netlify.toml").read_text()); json.loads(pathlib.Path("public/assets/ncn-theme/config.json").read_text())'
          git diff --quiet -- package.json package-lock.json netlify/lib/ncn-event-private netlify/lib/ncn-gvgs-private public/assets/ncn-event.css public/assets/ncn-gvgs.css public/assets/ncn-direct public/assets/ncn-sticker public/assets/ncn-popup public/assets/ncn-store-tools public/assets/ncn-theme/mobile.css public/assets/ncn-theme/mobile.js public/assets/ncn-theme/theme.js public/assets/ncn-theme/theme.css
      - name: Luu ma nguon
        run: |
          git add -A -- public netlify netlify.toml
          if [ -d ncn-vip-payments-backup ]; then git add -A -- ncn-vip-payments-backup; fi
          if git diff --cached --quiet; then
            echo "Khong co thay doi can luu."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Them thanh toan VIP SePay cho NCN"
          git push origin HEAD:"$NCN_BRANCH"
